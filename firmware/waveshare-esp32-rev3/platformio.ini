; ============================================================
; Waveshare e-Paper ESP32 Driver Board Universal REV3 Firmware
; ============================================================
;
; Device: Waveshare Universal e-Paper Driver Board
; MCU: ESP32 Classic (No PSRAM typically)
; Display: Universal - supports various Waveshare e-paper panels
; Features: 24-pin FFC connector for e-paper displays
; Battery: User-provided
;
; Build: pio run
; Upload: pio run -t upload
; Monitor: pio device monitor
;
; Note: This board uses standard ESP32 (not S3)
;       Pin mappings differ slightly from other boards (CS=15)
;
; ============================================================

[platformio]
src_dir = src

[env:waveshare-esp32-rev3]
platform = espressif32
board = esp32dev
framework = arduino

; Serial monitor
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time

; Build flags
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_ARDUHAL_LOG_COLORS=1
    ; Select Waveshare ESP32 REV3 device
    -D DEVICE_WAVESHARE_ESP32_REV3
    ; No PSRAM on standard board
    ; -D BOARD_HAS_PSRAM
    ; Hardware crypto acceleration
    -D CONFIG_MBEDTLS_HARDWARE_SHA=1
    -D CONFIG_MBEDTLS_HARDWARE_AES=1
    -D CONFIG_MBEDTLS_HARDWARE_MPI=1
    ; Larger stack for HTTPS (no PSRAM to help)
    -D CONFIG_ARDUINO_LOOP_STACK_SIZE=49152
    ; SD card typically present on Waveshare boards
    ; But can disable if not using
    ; -D NO_SD_CARD=1

; Partition scheme
board_build.filesystem = spiffs

; Libraries
lib_deps =
    ricmoo/QRCode @ ^0.0.1

; Upload settings
upload_speed = 921600
