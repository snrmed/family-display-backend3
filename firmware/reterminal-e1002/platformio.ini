; ============================================================
; Seeed reTerminal E1002 - ESP32-S3 Firmware
; ============================================================
;
; Device: Seeed reTerminal E1002
; MCU: ESP32-S3R8 (8MB PSRAM, 32MB Flash)
; Display: E Ink Spectra 6 (800×480, 7.3")
; Features: SHT40 temp/humidity, microphone, buzzer, RTC
; Battery: 2000mAh built-in
;
; Build: pio run
; Upload: pio run -t upload
; Monitor: pio device monitor
;
; ============================================================

[platformio]
src_dir = src

[env:reterminal-e1002]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Serial monitor
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time

; Build flags
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_ARDUHAL_LOG_COLORS=1
    ; Select reTerminal E1002 device
    -D DEVICE_RETERMINAL_E1002
    ; ESP32-S3 PSRAM (8MB)
    -D BOARD_HAS_PSRAM
    -D CONFIG_SPIRAM_USE_MALLOC=1
    ; Hardware crypto acceleration
    -D CONFIG_MBEDTLS_HARDWARE_SHA=1
    -D CONFIG_MBEDTLS_HARDWARE_AES=1
    -D CONFIG_MBEDTLS_HARDWARE_MPI=1
    ; HTTPS/TLS stack size
    -D CONFIG_ARDUINO_LOOP_STACK_SIZE=16384
    ; Disable SD card (using PSRAM only)
    -D NO_SD_CARD=1

; Enable PSRAM
board_build.psram = enabled

; Partition scheme for 8MB flash
; Options: default_8MB.csv, huge_app.csv, min_spiffs.csv
; Using default_8MB for good SPIFFS size
board_build.partitions = default_8MB.csv
board_build.filesystem = spiffs

; Libraries
lib_deps =
    ricmoo/QRCode @ ^0.0.1

; Upload settings
upload_speed = 921600
