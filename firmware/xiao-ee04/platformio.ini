; ============================================================
; Seeed XIAO ePaper Display Board EE04 - ESP32-S3 Firmware
; ============================================================
;
; Device: Seeed XIAO ePaper Display Board EE04
; MCU: ESP32-S3 Plus (8MB PSRAM, 32MB Flash)
; Display: Supports 7.3" Spectra 6 (800×480, 7-color)
; Features: Font chip (GT32L32S0140), 3 user buttons
; Battery: User-provided via JST connector
;
; Build: pio run
; Upload: pio run -t upload
; Monitor: pio device monitor
;
; ============================================================

[platformio]
src_dir = src

[env:xiao-ee04]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

; Serial monitor
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time

; Build flags
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_ARDUHAL_LOG_COLORS=1
    ; Select XIAO EE04 device
    -D DEVICE_XIAO_EE04
    ; ESP32-S3 PSRAM (8MB)
    -D BOARD_HAS_PSRAM
    -D CONFIG_SPIRAM_USE_MALLOC=1
    ; Hardware crypto acceleration
    -D CONFIG_MBEDTLS_HARDWARE_SHA=1
    -D CONFIG_MBEDTLS_HARDWARE_AES=1
    -D CONFIG_MBEDTLS_HARDWARE_MPI=1
    ; HTTPS/TLS stack size
    -D CONFIG_ARDUINO_LOOP_STACK_SIZE=16384
    ; Disable SD card (using PSRAM only)
    -D NO_SD_CARD=1

; Enable PSRAM
board_build.psram = enabled

; Partition scheme
board_build.filesystem = spiffs

; Libraries
lib_deps =
    ricmoo/QRCode @ ^0.0.1

; Upload settings
upload_speed = 921600
