; PlatformIO Project Configuration File
; ============================================================
; KIND Display - ESP32 Firmware
; ============================================================
;
; Build and upload instructions:
;   1. Install PlatformIO: https://platformio.org/install
;   2. Open this folder in VS Code with PlatformIO extension
;   3. Click "Build" to compile
;   4. Click "Upload" to flash to ESP32
;
; Or use command line:
;   pio run           # Build
;   pio run -t upload # Build and upload
;   pio device monitor # Serial monitor
;
; ============================================================

[platformio]
; Source directory (where .ino and .cpp files are located)
src_dir = KindDisplay

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial monitor settings
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time

; Build flags
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_ARDUHAL_LOG_COLORS=1
    -D BOARD_HAS_PSRAM

board_build.psram = enabled

; Library dependencies
lib_deps =
    ricmoo/QRCode @ ^0.0.1

; Upload settings
upload_speed = 921600

; Partition scheme - use default_16MB for more SPIFFS space
; This gives us ~1.5MB SPIFFS which is plenty for caching RAW7 images (192KB each)
board_build.partitions = default_16MB.csv

; Filesystem - using SPIFFS for flash cache
board_build.filesystem = spiffs

; ============================================================
; Alternative board configurations (uncomment if needed)
; ============================================================

; For ESP32-S2
; [env:esp32-s2-dev]
; platform = espressif32
; board = esp32-s2-saola-1
; framework = arduino
; monitor_speed = 115200

; For ESP32-S3
; [env:esp32-s3-dev]
; platform = espressif32
; board = esp32-s3-devkitc-1
; framework = arduino
; monitor_speed = 115200

; For ESP32-C3
; [env:esp32-c3-dev]
; platform = espressif32
; board = esp32-c3-devkitm-1
; framework = arduino
; monitor_speed = 115200
