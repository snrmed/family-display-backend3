; PlatformIO Project Configuration File
; ============================================================
; KIND Display - ESP32 Firmware
; ============================================================
;
; Build and upload instructions:
;   1. Install PlatformIO: https://platformio.org/install
;   2. Open this folder in VS Code with PlatformIO extension
;   3. Click "Build" to compile
;   4. Click "Upload" to flash to ESP32
;
; Or use command line:
;   pio run           # Build
;   pio run -t upload # Build and upload
;   pio device monitor # Serial monitor
;
; ============================================================

[platformio]
; Source directory (where .ino and .cpp files are located)
src_dir = KindDisplay

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial monitor settings
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time

; Build flags
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_ARDUHAL_LOG_COLORS=1
    ; Increase main task stack size for HTTPS/TLS operations
    ; Default is 8192, but ECDSA crypto in TLS handshake needs 40-50KB on ESP32 without PSRAM
    ; Setting to 49152 bytes (48KB) to accommodate mbedtls ECDSA operations
    -D CONFIG_ARDUINO_LOOP_STACK_SIZE=49152
    ; Enable ESP32 hardware crypto acceleration to reduce stack usage
    -D CONFIG_MBEDTLS_HARDWARE_SHA=1
    -D CONFIG_MBEDTLS_HARDWARE_AES=1
    -D CONFIG_MBEDTLS_HARDWARE_MPI=1
    ; Disable PSRAM since we don't have it on ESP32-S
    ; -D BOARD_HAS_PSRAM

; Disable PSRAM (we don't have it on ESP32-S modules)
; board_build.psram = enabled

; Library dependencies
lib_deps =
    ricmoo/QRCode @ ^0.0.1

; Upload settings
upload_speed = 921600

; Partition scheme - using default which provides ~1.5MB SPIFFS
; This is plenty for caching RAW7 images (192KB each)
; Note: If you have 16MB flash, you can create a custom partition table
; board_build.partitions = default.csv  # Default 4MB layout
# board_build.partitions = min_spiffs.csv  # Minimal SPIFFS (not recommended)

; Filesystem - using SPIFFS for flash cache
board_build.filesystem = spiffs

; ============================================================
; Alternative board configurations (uncomment if needed)
; ============================================================

; For ESP32-S2
; [env:esp32-s2-dev]
; platform = espressif32
; board = esp32-s2-saola-1
; framework = arduino
; monitor_speed = 115200

; For ESP32-S3
; [env:esp32-s3-dev]
; platform = espressif32
; board = esp32-s3-devkitc-1
; framework = arduino
; monitor_speed = 115200

; For ESP32-C3
; [env:esp32-c3-dev]
