; PlatformIO Project Configuration File
; ============================================================
; KIND Display - ESP32 Firmware
; ============================================================
;
; Build and upload instructions:
;   1. Install PlatformIO: https://platformio.org/install
;   2. Open this folder in VS Code with PlatformIO extension
;   3. Click "Build" to compile
;   4. Click "Upload" to flash to ESP32
;
; Or use command line:
;   pio run           # Build
;   pio run -t upload # Build and upload
;   pio device monitor # Serial monitor
;
; ============================================================

[platformio]
; Source directory (where .ino and .cpp files are located)
src_dir = KindDisplay

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial monitor settings
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time

; Build flags
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_ARDUHAL_LOG_COLORS=1

; Library dependencies
lib_deps =
    ricmoo/QRCode @ ^0.0.1

; Upload settings
upload_speed = 921600

; ============================================================
; IMPORTANT: Specify your ESP32's serial port to avoid auto-detection issues
; Find your port with: ls /dev/cu.* | grep -v Bluetooth
; ============================================================
; Uncomment ONE of these based on your port (run the command above first):
; upload_port = /dev/cu.wchusbserial*     ; macOS with CH340 driver (most common)
; upload_port = /dev/cu.usbserial-*       ; macOS alternative
; upload_port = /dev/cu.SLAB_USBtoUART    ; macOS with CP2102 driver
; upload_port = COM3                       ; Windows example
; upload_port = /dev/ttyUSB0               ; Linux example
; ============================================================

; Partition scheme (use default with more app space if needed)
board_build.partitions = default.csv

; Filesystem (if using SPIFFS/LittleFS in future)
; board_build.filesystem = littlefs

; ============================================================
; Alternative board configurations (uncomment if needed)
; ============================================================

; For ESP32-S2
; [env:esp32-s2-dev]
; platform = espressif32
; board = esp32-s2-saola-1
; framework = arduino
; monitor_speed = 115200

; For ESP32-S3
; [env:esp32-s3-dev]
; platform = espressif32
; board = esp32-s3-devkitc-1
; framework = arduino
; monitor_speed = 115200

; For ESP32-C3
; [env:esp32-c3-dev]
; platform = espressif32
; board = esp32-c3-devkitm-1
; framework = arduino
; monitor_speed = 115200
