<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kin:D Family Display Render</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 800px;
      height: 480px;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      background: #fff;
    }
    
    #canvas {
      position: relative;
      width: 800px;
      height: 480px;
      overflow: hidden;
    }
    
    .el {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .el.text {
      z-index: 30;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    
    .el.icon {
      z-index: 30;
    }
    
    .el.box {
      z-index: 15;
    }
    
    .el.svg,
    .el.svg-overlay,
    .el.image {
      z-index: 20;
    }
    
    .el.weather-icon {
      z-index: 35;
    }
    
    .el svg {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    .background-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div id="canvas"></div>
  
  <script>
    // Parse data from URL query parameter
    const urlParams = new URLSearchParams(window.location.search);
    const encodedData = urlParams.get('data');
    
    if (!encodedData) {
      console.error('No data parameter provided');
      document.body.innerHTML = '<div style="padding: 20px;">Error: No render data provided</div>';
    } else {
      try {
        const dataJson = decodeURIComponent(encodedData);
        const data = JSON.parse(dataJson);
        console.log('Render data:', data);
        
        // Render the layout
        renderLayout(data);
      } catch (error) {
        console.error('Failed to parse render data:', error);
        document.body.innerHTML = '<div style="padding: 20px;">Error: Invalid render data</div>';
      }
    }
    
    /**
     * Resolve relative/absolute paths to full URLs
     * CRITICAL: This function enables SVG rendering in Playwright's file:// context
     */
    function resolveUrl(path, svg_base) {
      if (!path) return "";
      
      // Already absolute URL - use as-is
      if (path.startsWith("http://") || path.startsWith("https://")) {
        return path;
      }
      
      // Absolute path starting with / - needs base URL
      if (path.startsWith("/")) {
        // Extract base from svg_base (which should be full URL)
        if (svg_base && svg_base.startsWith("http")) {
          // svg_base is like: https://domain.com/gcs/assets/svgs
          // Extract: https://domain.com
          const base = svg_base.split("/gcs/")[0];
          return base + path;
        }
        // Fallback: return as-is (will fail in file:// but at least we tried)
        return path;
      }
      
      // Relative path - prepend svg_base
      if (svg_base) {
        return svg_base.replace(/\/$/, "") + "/" + path;
      }
      
      return path;
    }

    /**
     * Apply text shadow or glow effect
     * NEW: Supports text shadows and glows from designer
     */
    function applyTextShadow(element, shadowType, shadowColor, shadowIntensity) {
      if (!shadowType || shadowType === 'none') {
        element.style.textShadow = 'none';
        element.style.filter = 'none';
        return;
      }
      
      const intensity = parseFloat(shadowIntensity || 1);
      const color = shadowColor || '#000000';
      const blur = Math.round(intensity * 4);
      
      if (shadowType === 'shadow') {
        // Drop shadow
        element.style.textShadow = `2px 2px ${blur}px ${color}`;
      } else if (shadowType === 'glow') {
        // Glow effect using multiple text-shadows
        element.style.textShadow = `
          0 0 ${blur}px ${color},
          0 0 ${blur * 2}px ${color},
          0 0 ${blur * 3}px ${color}
        `;
      }
    }

    /**
     * Get text content based on element type
     * UPDATED: Includes new weather types (WEATHER_DESC_EXTENDED, TOMORROW_DESC, TOMORROW_TEMP)
     */
    function getDynamicText(type, data) {
      switch (type) {
        case "WEATHER_CITY":
        case "CITY":
          return data.weather?.city || data.device?.location?.city || "City";
        
        case "TEMP":
          return data.weather?.temp != null
            ? data.weather.temp + "°C"
            : "--°C";
        
        case "WEATHER_MINMAX":
          if (data.weather?.temp_min != null && data.weather?.temp_max != null) {
            return data.weather.temp_min + "° / " + data.weather.temp_max + "°";
          }
          return "--° / --°";
        
        case "FEELS_LIKE":
          return data.weather?.feels_like != null
            ? data.weather.feels_like + "°C"
            : "--°C";
        
        case "HUMIDITY":
          return data.weather?.humidity != null
            ? "Humidity: " + data.weather.humidity + "%"
            : "Humidity: --%";
        
        case "RAIN":
          return data.weather?.rain != null
            ? "Rain: " + data.weather.rain + "mm"
            : "Rain: --mm";
        
        case "WIND":
          return data.weather?.wind != null
            ? "Wind: " + data.weather.wind + "km/h"
            : "Wind: --km/h";
        
        case "WEATHER_DESC":
          return data.weather?.desc || "Sunny";
        
        // NEW: Extended weather description with forecast
        case "WEATHER_DESC_EXTENDED":
          return data.weather?.desc_extended || data.weather?.desc || "Sunny with clear skies";
        
        // NEW: Tomorrow's forecast description
        case "TOMORROW_DESC":
          return data.weather?.tomorrow?.desc || "Partly cloudy, 24°-31°C";
        
        // NEW: Tomorrow's temperature range
        case "TOMORROW_TEMP":
          if (data.weather?.tomorrow?.temp_min && data.weather?.tomorrow?.temp_max) {
            return data.weather.tomorrow.temp_min + "° / " + data.weather.tomorrow.temp_max + "°";
          }
          return "--° / --°";
        
        case "JOKE":
          return data.dad_joke || "No joke today.";
        
        case "DATE":
          return data.date || "";

        default:
          return "";
      }
    }

    /**
     * Calculate z-index based on element type
     */
    function getLayerZIndex(el, providedKind) {
      const kind = (providedKind || el.kind || "").toLowerCase();
      
      if (kind === "text" || kind === "icon") {
        return 30;
      }

      if (kind === "svg" || kind === "svg-overlay" || kind === "image") {
        const source = String(el.src || el.svgName || "");
        if (source === "weather-icon" || source.startsWith("weather-")) {
          return 35;
        }
        return 20;
      }

      if (kind === "box") {
        return 15;
      }

      return 10;
    }

    /**
     * Load SVG from URL and inline it
     */
    async function inlineSvgInto(elDiv, url) {
      console.log("📥 Fetching SVG:", url);
      
      try {
        const response = await fetch(url, { mode: "cors" });
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        
        const svgText = await response.text();
        
        // Insert SVG markup
        elDiv.innerHTML = svgText;
        
        // Make SVG fill container
        const svg = elDiv.querySelector("svg");
        if (svg) {
          svg.setAttribute("width", "100%");
          svg.setAttribute("height", "100%");
          svg.style.display = "block";
        }
        
        console.log("✓ SVG loaded successfully");
      } catch (error) {
        console.error("Failed to load SVG:", error);
        elDiv.innerHTML = `<div style="color: red; font-size: 12px;">SVG Load Error</div>`;
      }
    }

    /**
     * Render the complete layout
     * UPDATED: Includes text shadow support and new weather types
     */
    async function renderLayout(data) {
      const canvas = document.getElementById('canvas');
      const layout = data.layout || {};
      const elements = layout.elements || [];
      const svg_base = data.svg_base || "";
      
      console.log('SVG Base:', svg_base);
      console.log('Rendering', elements.length, 'elements');
      
      // Add background image if provided
      if (data.bg_url) {
        const bgImg = document.createElement('img');
        bgImg.src = data.bg_url;
        bgImg.className = 'background-image';
        bgImg.onerror = () => {
          console.warn('Background image failed to load:', data.bg_url);
        };
        canvas.appendChild(bgImg);
      }
      
      // Process each element
      for (const el of elements) {
        const elDiv = document.createElement('div');
        elDiv.className = 'el';
        
        const kind = (el.kind || 'box').toLowerCase();
        elDiv.classList.add(kind);
        
        // Position and size
        elDiv.style.left = (el.x || 0) + 'px';
        elDiv.style.top = (el.y || 0) + 'px';
        elDiv.style.width = (el.w || el.width || 100) + 'px';
        elDiv.style.height = (el.h || el.height || 100) + 'px';
        
        // Z-index
        const zIndex = el.zIndex || getLayerZIndex(el, kind);
        elDiv.style.zIndex = zIndex;
        
        // Opacity
        if (el.opacity != null) {
          elDiv.style.opacity = el.opacity;
        }
        
        // Handle different element types
        if (kind === 'text' || kind === 'icon') {
          // Get text content (dynamic or static)
          let textContent;
          if (el.type && el.type !== 'CUSTOM') {
            textContent = getDynamicText(el.type, data);
          } else {
            textContent = el.text || 'Text';
          }
          
          elDiv.textContent = textContent;
          elDiv.style.fontSize = (el.fontSize || 16) + 'px';
          elDiv.style.color = el.color || '#000000';
          elDiv.style.fontWeight = el.weight || el.fontWeight || '400';
          elDiv.style.fontFamily = el.fontFamily || 'Inter, sans-serif';
          elDiv.style.display = 'flex';
          elDiv.style.alignItems = 'center';
          elDiv.style.justifyContent = 'center';
          elDiv.style.textAlign = 'center';
          elDiv.style.padding = '4px';
          elDiv.style.lineHeight = '1.2';
          elDiv.style.wordBreak = 'break-word';
          
          // Handle text alignment
          if (el.textAlign) {
            elDiv.style.textAlign = el.textAlign;
            if (el.textAlign === 'left') {
              elDiv.style.justifyContent = 'flex-start';
            } else if (el.textAlign === 'right') {
              elDiv.style.justifyContent = 'flex-end';
            }
          }
          
          // NEW: Apply text shadow/glow if specified
          if (el.textShadowType && el.textShadowType !== 'none') {
            applyTextShadow(elDiv, el.textShadowType, el.textShadowColor, el.textShadowIntensity);
          }
          
        } else if (kind === 'box') {
          // Box element
          if (el.background || el.fill) {
            elDiv.style.background = el.background || el.fill;
          }
          if (el.borderColor) {
            elDiv.style.border = '1px solid ' + el.borderColor;
          }
          if (el.borderRadius || el.radius) {
            elDiv.style.borderRadius = (el.borderRadius || el.radius) + 'px';
          }
          
        } else if (kind === 'svg' || kind === 'svg-overlay' || kind === 'image') {
          // SVG or image element
          let src = el.src || el.svgName || '';
          
          // Handle weather icon special case
          if (src === 'weather-icon') {
            if (data.weather?.icon_url) {
              src = data.weather.icon_url;
              elDiv.classList.add('weather-icon');
            } else {
              console.warn('No weather icon URL available');
              continue;
            }
          }
          
          // Resolve URL to absolute path
          const fullUrl = resolveUrl(src, svg_base);
          
          if (fullUrl.endsWith('.svg')) {
            // Load and inline SVG
            await inlineSvgInto(elDiv, fullUrl);
          } else {
            // Load as image
            const img = document.createElement('img');
            img.src = fullUrl;
            img.style.width = '100%';
            img.style.height = '100%';
            img.style.objectFit = 'contain';
            img.onerror = () => {
              console.error('Image failed to load:', fullUrl);
            };
            elDiv.appendChild(img);
          }
        }
        
        canvas.appendChild(elDiv);
      }
      
      console.log('✓ Layout rendered successfully');
    }
  </script>
</body>
</html>
