<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kin:D Display</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 800px;
      height: 480px;
      overflow: hidden;
      position: relative;
      background: #000;
    }
    
    #bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }
    
    #root {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    
    .el {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .el.wrap {
      white-space: normal;
      word-wrap: break-word;
    }
    
    #fallback-box {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px;
      background: rgba(255,255,255,0.9);
      border-radius: 12px;
      font-family: Arial, sans-serif;
      font-size: 18px;
      color: #333;
      text-align: center;
      z-index: 999;
    }
  </style>
</head>
<body>
  <img id="bg" src="" alt="Background">
  <div id="root"></div>
  <div id="fallback-box">
    <p>⚠️ No layout data</p>
    <p style="font-size: 14px; margin-top: 10px;">Check render_data endpoint</p>
  </div>

  <script>
    // ================================================================
    // CRITICAL FIX: URL Resolution for Playwright
    // ================================================================
    
    /**
     * Parse data from URL query string
     * Expected format: ?data=<url_encoded_json>
     */
    function getDataFromQuery() {
      const params = new URLSearchParams(window.location.search);
      const encoded = params.get("data");
      
      if (!encoded) {
        console.error("❌ No data parameter in URL");
        return null;
      }
      
      try {
        const decoded = decodeURIComponent(encoded);
        const data = JSON.parse(decoded);
        console.log("✅ Parsed data:", {
          layout_elements: data.layout?.elements?.length || 0,
          svg_base: data.svg_base || "not_set",
          weather_icon: data.weather?.icon_url || "not_set"
        });
        return data;
      } catch (e) {
        console.error("❌ Failed to parse data:", e);
        return null;
      }
    }

    /**
     * CRITICAL FIX: Resolve URLs properly for Playwright
     * When running under file:// protocol, we need full absolute URLs
     */
    function resolveUrl(path, svg_base) {
      if (!path) return "";
      
      // Already absolute URL - use as-is
      if (path.startsWith("http://") || path.startsWith("https://")) {
        return path;
      }
      
      // Absolute path starting with / - needs base URL
      if (path.startsWith("/")) {
        // Extract base from svg_base (which should be full URL)
        if (svg_base && svg_base.startsWith("http")) {
          // svg_base is like: https://domain.com/gcs/assets/svgs
          // Extract: https://domain.com
          const base = svg_base.split("/gcs/")[0];
          return base + path;
        }
        // Fallback: return as-is (will fail in file:// but at least we tried)
        return path;
      }
      
      // Relative path - prepend svg_base
      if (svg_base) {
        return svg_base.replace(/\/$/, "") + "/" + path;
      }
      
      return path;
    }

    /**
     * Get text content based on element type
     */
    function textFromType(el, data) {
      const type = el.type || "CUSTOM";
      
      switch (type) {
        case "WEATHER_CITY":
        case "CITY":
          return data.weather?.city || "City";
        
        case "TEMP":
          return data.weather?.temp != null 
            ? data.weather.temp + "°C"
            : "--°C";
        
        case "HUMIDITY":
          return data.weather?.humidity != null
            ? "Humidity: " + data.weather.humidity + "%"
            : "Humidity: --%";
        
        case "JOKE":
          return data.dad_joke || "No joke today.";
        
        case "DATE":
          return data.date || "";
        
        case "WEATHER_MINMAX":
          if (data.weather?.temp_min != null && data.weather?.temp_max != null) {
            return data.weather.temp_min + "° / " + data.weather.temp_max + "°";
          }
          return "--° / --°";

        default:
          return el.text || "";
      }
    }

    /**
     * Load SVG from URL and inline it
     * CRITICAL FIX: Uses full absolute URLs
     */
    async function inlineSvgInto(elDiv, url) {
      console.log("📥 Fetching SVG:", url);
      
      try {
        const response = await fetch(url, { mode: "cors" });
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        
        const svgText = await response.text();
        
        // Insert SVG markup
        elDiv.innerHTML = svgText;
        
        // Make SVG fill container
        const svg = elDiv.querySelector("svg");
        if (svg) {
          svg.setAttribute("width", "100%");
          svg.setAttribute("height", "100%");
          svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
          console.log("✅ SVG loaded successfully");
        }
      } catch (error) {
        console.error("❌ SVG fetch failed:", url, error);
        // Show error visually
        elDiv.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:12px;color:#ff0000;">SVG Error</div>`;
      }
    }

    /**
     * Main initialization
     */
    (async function init() {
      const data = getDataFromQuery();
      const bg = document.getElementById("bg");
      const root = document.getElementById("root");
      const fallback = document.getElementById("fallback-box");

      if (!data) {
        fallback.style.display = "block";
        return;
      }

      // Set background (prefer dynamic Pexels selection)
      const backgroundUrl = (data.pexels && data.pexels.url) || data.bg_url;
      if (backgroundUrl) {
        bg.src = backgroundUrl;
      }

      const layout = data.layout;
      if (!layout || !Array.isArray(layout.elements) || layout.elements.length === 0) {
        console.warn("⚠️  No layout elements");
        fallback.style.display = "block";
        return;
      }

      fallback.style.display = "none";

      // CRITICAL: Get svg_base from data (should be full URL)
      const svg_base = data.svg_base || "/gcs/assets/svgs";
      console.log("🎨 Rendering with svg_base:", svg_base);

      // Render each element
      for (const el of layout.elements) {
        const div = document.createElement("div");
        div.className = "el";

        // Position
        div.style.left = (el.x || 0) + "px";
        div.style.top = (el.y || 0) + "px";
        
        // Size
        if (el.w != null) div.style.width = el.w + "px";
        if (el.h != null) div.style.height = el.h + "px";

        // Styling
        if (el.radius != null) div.style.borderRadius = el.radius + "px";
        if (el.fill) div.style.background = el.fill;
        if (el.border) div.style.border = el.border;
        if (el.shadow) div.style.boxShadow = el.shadow;
        if (el.opacity != null) div.style.opacity = el.opacity;

        const kind = (el.kind || "").toLowerCase();

        // ============================================================
        // TEXT ELEMENTS
        // ============================================================
        if (kind === "text") {
          const span = document.createElement("div");
          span.textContent = textFromType(el, data);

          // Text styling
          if (el.fontFamily) span.style.fontFamily = el.fontFamily;
          if (el.fontSize) span.style.fontSize = el.fontSize + "px";
          if (el.color) span.style.color = el.color;
          if (el.weight) span.style.fontWeight = el.weight;
          if (el.align) span.style.textAlign = el.align;
          if (el.wrap) span.style.whiteSpace = "normal";

          if (el.textShadowType && el.textShadowType !== "none") {
            const intensity = parseFloat(el.textShadowIntensity ?? 1) || 1;
            const color = el.textShadowColor || "#000000";
            if (el.textShadowType === "drop") {
              const blur = 4 * intensity;
              const offset = 2 * intensity;
              span.style.textShadow = `${offset}px ${offset}px ${blur}px ${color}`;
            } else if (el.textShadowType === "glow") {
              const blur = 8 * intensity;
              span.style.textShadow = `0 0 ${blur}px ${color}`;
            }
          } else {
            span.style.textShadow = "none";
          }

          span.style.width = "100%";
          span.style.height = "100%";
          span.style.display = "flex";
          span.style.alignItems = "center";
          span.style.justifyContent = "center";
          
          div.appendChild(span);
        }
        
        // ============================================================
        // ICON/SVG ELEMENTS - CRITICAL FIX
        // ============================================================
        else if (kind === "icon" || kind === "svg" || kind === "svg-overlay") {
          let src = el.src || "";
          
          // Special case: weather icon shorthand
          if (src === "weather-icon" && data.weather?.icon_url) {
            src = data.weather.icon_url;
          }
          
          // CRITICAL: Resolve URL properly
          const resolvedUrl = resolveUrl(src, svg_base);
          console.log(`🔗 ${kind} element:`, { original: src, resolved: resolvedUrl });
          
          // Load SVG
          if (resolvedUrl.endsWith(".svg")) {
            await inlineSvgInto(div, resolvedUrl);
          } else {
            // Raster image
            const img = document.createElement("img");
            img.src = resolvedUrl;
            img.style.width = "100%";
            img.style.height = "100%";
            img.style.objectFit = "contain";
            div.appendChild(img);
          }
        }
        
        // ============================================================
        // BOX ELEMENTS (styling already applied above)
        // ============================================================
        // Boxes don't need content, just visual styling

        root.appendChild(div);
      }
      
      console.log("✅ Render complete:", layout.elements.length, "elements");
    })();
  </script>
</body>
</html>
