<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kin:D Frame</title>
  <meta name="viewport" content="width=800, initial-scale=1" />
  <style>
    :root {
      --w: 800px;
      --h: 480px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: var(--w);
      height: var(--h);
      background: #111;
      overflow: hidden;
      position: relative;
      font-family: var(--font);
    }
    #bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }
    #root {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }
    .el {
      position: absolute;
      pointer-events: none;
    }
    .wrap { white-space: normal; word-break: break-word; }
    .el-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    /* emergency box */
    #fallback-box {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      padding: 16px;
      background: rgba(200,0,0,0.9);
      color: #fff;
      border-radius: 16px;
      font-size: 14px;
      z-index: 99;
    }
  </style>
</head>
<body>
  <img id="bg" alt="background" />
  <div id="root"></div>
  <div id="fallback-box" style="display:none;">No layout found in data.layout.</div>

  <script>
    function getDataFromQuery() {
      const sp = new URLSearchParams(location.search);
      const raw = sp.get("data");
      if (!raw) return null;
      try { return JSON.parse(raw); } catch (e) { return null; }
    }

    // map layout element type -> real text
    function textFromType(el, data) {
      const t = (el.type || "").toUpperCase();
      switch (t) {
        case "CITY":
          return data.city || "City";
        case "TEMP":
          return data.weather && data.weather.temp != null
            ? data.weather.temp + "°C"
            : "--°C";
        case "HUMIDITY":
          return data.weather && data.weather.humidity != null
            ? "Humidity: " + data.weather.humidity + "%"
            : "Humidity: --%";
        case "WIND":
          return data.weather && data.weather.wind != null
            ? "Wind: " + data.weather.wind + " km/h"
            : "Wind: -- km/h";
        case "RAIN":
          return data.weather && data.weather.rain != null
            ? "Rain: " + data.weather.rain
            : "Rain: --";
        case "JOKE":
          return data.dad_joke || "No joke today.";
        case "DATE":
          return data.date || "";
        default:
          return el.text || "";
      }
    }

    (function init(){
      const data = getDataFromQuery();
      const bg = document.getElementById("bg");
      const root = document.getElementById("root");
      const fb = document.getElementById("fallback-box");

      if (!data) {
        fb.style.display = "block";
        return;
      }

      // 1) background: prefer server-provided, else try theme
      if (data.bg_url) {
        bg.src = data.bg_url;
      } else if (data.theme) {
        bg.src = "/gcs/pexels/current/" + data.theme + "_0.jpg";
      }

      // 2) layout: must come from data.layout (main.py now sends this)
      const layout = data.layout;
      if (!layout || !Array.isArray(layout.elements) || layout.elements.length === 0) {
        fb.style.display = "block";
        return;
      }
      fb.style.display = "none";

      // optional: if layout.meta has width/height, apply
      if (layout.meta) {
        if (layout.meta.width) {
          document.documentElement.style.setProperty("--w", layout.meta.width + "px");
          document.body.style.width = layout.meta.width + "px";
        }
        if (layout.meta.height) {
          document.documentElement.style.setProperty("--h", layout.meta.height + "px");
          document.body.style.height = layout.meta.height + "px";
        }
      }

      // base for svgs (main.py sends this)
      const svgBase = data.svg_base || "/gcs/assets/svgs";

      layout.elements.forEach(el => {
        const d = document.createElement("div");
        d.className = "el";
        d.style.left = (el.x || 0) + "px";
        d.style.top = (el.y || 0) + "px";
        if (el.w != null) d.style.width = el.w + "px";
        if (el.h != null) d.style.height = el.h + "px";
        if (el.radius != null) d.style.borderRadius = el.radius + "px";
        if (el.fill) d.style.background = el.fill;
        if (el.border) d.style.border = el.border;
        if (el.shadow) d.style.boxShadow = el.shadow;
        if (el.opacity != null) d.style.opacity = el.opacity;

        const kind = (el.kind || "").toLowerCase();

        if (kind === "text") {
          const span = document.createElement("div");
          const txt = textFromType(el, data);
          span.textContent = txt;
          if (el.fontFamily) span.style.fontFamily = el.fontFamily;
          if (el.fontSize) span.style.fontSize = el.fontSize + "px";
          if (el.color) span.style.color = el.color;
          if (el.wrap) span.classList.add("wrap");
          d.appendChild(span);

        } else if (kind === "icon") {
          const img = document.createElement("img");

          // SOURCE PRIORITY:
          // 1. explicit weather marker
          // 2. el.src as given
          // 3. el.src as filename → prefix with svgBase
          let src = el.src || "";

          // allow designer to say "weather-icon" or "{{weather.icon}}"
          if (src === "weather-icon" || src === "{{weather.icon}}") {
            src = (data.weather && data.weather.icon_url) ? data.weather.icon_url : "";
          }

          // if it's just "lemon.svg" or "myicon.svg" → stick on the svg base
          if (src && !src.startsWith("http") && !src.startsWith("/")) {
            src = svgBase.replace(/\/$/, "") + "/" + src;
          }

          img.src = src;
          img.alt = el.alt || "icon";
          img.style.width = "100%";
          img.style.height = "100%";
          img.style.objectFit = "contain";

          d.classList.add("el-icon");
          d.appendChild(img);
        }

        // box kind: nothing else to do
        root.appendChild(d);
      });
    })();
  </script>
</body>
</html>
