<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kin:D Frame</title>
  <meta name="viewport" content="width=800, height=480, initial-scale=1.0" />
  <style>
    :root {
      --bg: #111;
      --card: rgba(255,255,255,0.90);
      --radius: 26px;
      --shadow: 0 8px 30px rgba(0,0,0,.25);
      --text: #000;
    }
    body {
      margin: 0;
      padding: 0;
      background: #111;
      width: 800px;
      height: 480px;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      position: relative;
    }
    #bgImg {
      position: absolute;
      inset: 0;
      width: 800px;
      height: 480px;
      object-fit: cover;
    }
    .card {
      position: absolute;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      color: var(--text);
    }
    #weatherCard {
      top: 16px;
      left: 16px;
      width: 320px;
      padding: 18px 20px 16px 20px;
    }
    #iconImg {
      width: 48px;
      height: 48px;
      object-fit: contain;
      display: inline-block;
      vertical-align: middle;
      margin-right: 10px;
    }
    #city {
      font-size: 20px;
      font-weight: 600;
    }
    #temp {
      font-size: 30px;
      font-weight: 700;
      margin-top: 14px;
    }
    #extras {
      margin-top: 10px;
      font-size: 13px;
      line-height: 1.35;
    }
    #jokeCard {
      left: 16px;
      right: 16px;
      bottom: 16px;
      height: 140px;
      padding: 18px 20px;
    }
    #jokeTitle {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    #jokeText {
      font-size: 17px;
      line-height: 1.3;
    }
    #badge {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 68px;
      height: 68px;
      background: rgba(255,255,255,0.95);
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 28px;
      color: #000;
      box-shadow: var(--shadow);
    }
    /* elements coming from Designer */
    .dyn-el {
      position: absolute;
      box-sizing: border-box;
    }
    .svg-el {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>
  <img id="bgImg" alt="background" />
  <div id="badge">–</div>

  <div id="weatherCard" class="card">
    <div style="display:flex; align-items:center;">
      <img id="iconImg" alt="icon" />
      <div id="city">City</div>
    </div>
    <div id="temp">--°C</div>
    <div id="extras">
      Humidity: --%<br/>
      Wind: -- km/h<br/>
      Rain: --
    </div>
  </div>

  <div id="jokeCard" class="card">
    <div id="jokeTitle">Dad joke</div>
    <div id="jokeText">No joke today.</div>
  </div>

  <script>
    // helper: build absolute URL for /gcs/... when rendering from file://
    function resolveUrl(url, base) {
      if (!url) return "";
      if (url.startsWith("http://") || url.startsWith("https://")) return url;
      if (url.startsWith("/gcs/")) {
        // we have a base from Python
        if (base) return base.replace(/\/+$/, "") + url;
        // worst case: fallback to relative, may fail in file://
        return url;
      }
      return url;
    }

    (function () {
      const params = new URLSearchParams(location.search);
      const raw = params.get("data") || "{}";
      const baseUrl = params.get("base") || "";     // ← this is your Cloud Run URL
      const data = JSON.parse(decodeURIComponent(raw));

      // 1) background
      const bgImg = document.getElementById("bgImg");
      const bgUrl = resolveUrl(data.bg_url, baseUrl);
      if (bgUrl) bgImg.src = bgUrl;

      // 2) weather
      const w = data.weather || {};
      const icon = document.getElementById("iconImg");
      const city = document.getElementById("city");
      const temp = document.getElementById("temp");
      const extras = document.getElementById("extras");

      if (w.icon_url) {
        icon.src = resolveUrl(w.icon_url, baseUrl);  // ← FIXED
      }
      city.textContent = data.city || "City";
      temp.textContent = (w.temp !== undefined ? w.temp : "--") + "°C";
      extras.innerHTML =
        "Humidity: " + (w.humidity ?? "--") + "%<br/>" +
        "Wind: " + (w.wind ?? "--") + " km/h<br/>" +
        "Rain: " + (w.rain ?? "--");

      // 3) joke
      const jTitle = document.getElementById("jokeTitle");
      const jText = document.getElementById("jokeText");
      jTitle.textContent = "Dad joke";
      jText.textContent = data.dad_joke || "No joke today.";

      // 4) badge
      const badge = document.getElementById("badge");
      badge.textContent = "—";

      // 5) render Designer layout (if present)
      const layout = data.layout || {};
      const svgBase = data.svg_base || (baseUrl ? baseUrl + "/gcs/assets/svgs" : "/gcs/assets/svgs");
      const els = layout.elements || [];
      els.forEach((el) => {
        const div = document.createElement("div");
        div.className = "dyn-el";
        div.style.left = (el.x || 0) + "px";
        div.style.top = (el.y || 0) + "px";
        div.style.width = (el.w || 50) + "px";
        div.style.height = (el.h || 50) + "px";
        if (el.radius) div.style.borderRadius = el.radius + "px";
        if (el.fill) div.style.background = el.fill;
        if (el.border) div.style.border = el.border;
        if (el.shadow) div.style.boxShadow = el.shadow;

        if (el.kind === "text") {
          div.style.display = "flex";
          div.style.alignItems = "flex-start";
          div.style.justifyContent = "flex-start";
          div.style.padding = "4px 6px";
          const span = document.createElement("span");
          span.textContent = el.type === "CITY" ? (data.city || "City") :
                             el.type === "TEMP" ? ((w.temp ?? "--") + "°C") :
                             el.type === "HUMIDITY" ? ("Humidity: " + (w.humidity ?? "--") + "%") :
                             el.type === "JOKE" ? (data.dad_joke || "No joke today.") :
                             (el.text || "");
          if (el.fontFamily) span.style.fontFamily = el.fontFamily;
          if (el.fontSize) span.style.fontSize = el.fontSize + "px";
          if (el.color) span.style.color = el.color;
          span.style.lineHeight = "1.1";
          span.style.wordBreak = "break-word";
          div.appendChild(span);
        }
        else if (el.kind === "icon") {
          const img = document.createElement("img");
          img.className = "svg-el";
          if (el.src) {
            if (el.src.startsWith("http://") || el.src.startsWith("https://")) {
              img.src = el.src;
            } else if (el.src.startsWith("/gcs/")) {
              img.src = resolveUrl(el.src, baseUrl);  // ← FIXED for bucket SVGs
            } else {
              img.src = svgBase.replace(/\/+$/, "") + "/" + el.src.replace(/^\/+/, "");
            }
          } else {
            img.src = svgBase.replace(/\/+$/, "") + "/lemon.svg";
          }
          div.appendChild(img);
        }

        document.body.appendChild(div);
      });
    })();
  </script>
</body>
</html>
