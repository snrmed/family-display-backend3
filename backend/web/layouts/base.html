<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kin:D Frame</title>
  <meta name="viewport" content="width=800,initial-scale=1.0" />
  <style>
    :root {
      --w: 800px;
      --h: 480px;
      --card-bg: rgba(236,236,236,1);
      --card-radius: 26px;
      --card-pad: 18px;
      --card-shadow: 0 10px 28px rgba(0,0,0,0.12);
      --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      --text: #111;
      --sub: #333;
      --badge: rgba(236,236,236,0.9);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: var(--w);
      height: var(--h);
      background: #101010;
      font-family: var(--font);
      position: relative;
      overflow: hidden;
    }

    /* background image always at the very back */
    #bgImg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* a layer we can add stuff to if we want */
    #layoutRoot {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
    }

    .card {
      position: absolute;
      background: var(--card-bg);
      border-radius: var(--card-radius);
      padding: var(--card-pad);
      box-shadow: var(--card-shadow);
      color: var(--text);
    }

    #weatherCard {
      left: 16px;
      top: 240px;
      width: 370px;
      min-height: 140px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    #weatherIcon {
      width: 52px;
      height: 52px;
      object-fit: contain;
      flex: 0 0 52px;
    }

    #weatherText {
      flex: 1;
    }

    #weatherText h2 {
      margin: 0 0 4px 0;
      font-size: 18px;
    }

    #weatherText p {
      margin: 0;
      font-size: 14px;
      line-height: 1.3;
      color: var(--sub);
    }

    #jokeCard {
      right: 16px;
      bottom: 16px;
      left: 16px;
      min-height: 52px;
      display: flex;
      align-items: center;
      padding-inline: 26px;
    }

    #jokeCard span {
      font-size: 16px;
      line-height: 1.3;
    }

    /* badge / close button */
    #badgeBtn {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 64px;
      height: 64px;
      border-radius: 24px;
      background: var(--badge);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 500;
      color: #000;
      z-index: 50;
    }

    /* layout-rendered elements */
    .l-box {
      position: absolute;
    }

    .l-text {
      position: absolute;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .l-icon {
      position: absolute;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <!-- background image (will be set by JS) -->
  <img id="bgImg" alt="background" />

  <!-- this is where JSON-driven elements will go -->
  <div id="layoutRoot"></div>

  <!-- fallback weather card -->
  <div id="weatherCard" class="card">
    <img id="weatherIcon" alt="icon" src="" />
    <div id="weatherText">
      <h2 id="weatherCity">---</h2>
      <p id="weatherTemp">• --°C</p>
      <p id="weatherMeta">Humidity: --%</p>
      <p id="weatherExtra">Wind: -- km/h</p>
      <p id="weatherRain">Rain: --</p>
    </div>
  </div>

  <!-- fallback joke card -->
  <div id="jokeCard" class="card">
    <span id="jokeText">No joke today.</span>
  </div>

  <!-- badge (debug / placeholder) -->
  <div id="badgeBtn">—</div>

  <script>
    // 1) read ?data=... from query
    const qs = new URLSearchParams(window.location.search);
    const raw = qs.get("data") || "{}";
    let data = {};
    try {
      data = JSON.parse(raw);
    } catch (e) {
      console.warn("Could not parse data query:", e);
      data = {};
    }

    // ---- helpers -------------------------------------------------
    function setBackground(url) {
      if (!url) return;
      const img = document.getElementById("bgImg");
      img.src = url;
    }

    function showFallbackWeather(d) {
      const wc = document.getElementById("weatherCard");
      const cityEl = document.getElementById("weatherCity");
      const tempEl = document.getElementById("weatherTemp");
      const metaEl = document.getElementById("weatherMeta");
      const extraEl = document.getElementById("weatherExtra");
      const rainEl = document.getElementById("weatherRain");
      const iconEl = document.getElementById("weatherIcon");

      const city = d.city || "—";
      cityEl.textContent = city;

      if (d.weather) {
        const w = d.weather;
        tempEl.textContent = "• " + (w.temp !== undefined ? w.temp + "°C" : "--°C");
        metaEl.textContent = "Humidity: " + (w.humidity !== undefined ? w.humidity + "%" : "--%");
        extraEl.textContent = "Wind: " + (w.wind !== undefined ? w.wind + " km/h" : "-- km/h");
        rainEl.textContent = "Rain: " + (w.rain ? w.rain : "No rain");
        if (w.icon_url) {
          iconEl.src = w.icon_url;
        } else {
          iconEl.src = "";
        }
      }
    }

    function showFallbackJoke(d) {
      const el = document.getElementById("jokeText");
      if (d.dad_joke) {
        el.textContent = d.dad_joke;
      }
    }

    // ---- layout renderer -----------------------------------------
    // renders Designer JSON (elements[]) if present
    function renderDesignerLayout(layout, payload) {
      const root = document.getElementById("layoutRoot");
      root.innerHTML = ""; // clear previous

      // if we render from layout, hide fallbacks
      document.getElementById("weatherCard").style.display = "none";
      document.getElementById("jokeCard").style.display = "none";

      const els = layout.elements || [];

      els.forEach((el) => {
        // common positioning
        const x = el.x || 0;
        const y = el.y || 0;
        const w = el.w || 100;
        const h = el.h || 50;

        if (el.kind === "box") {
          const d = document.createElement("div");
          d.className = "l-box";
          d.style.left = x + "px";
          d.style.top = y + "px";
          d.style.width = w + "px";
          d.style.height = h + "px";
          if (el.fill) d.style.background = el.fill;
          if (el.border) d.style.border = el.border;
          if (el.radius) d.style.borderRadius = el.radius + "px";
          if (el.shadow) d.style.boxShadow = el.shadow;
          root.appendChild(d);
        } else if (el.kind === "text") {
          const d = document.createElement("div");
          d.className = "l-text";
          d.style.left = x + "px";
          d.style.top = y + "px";
          d.style.width = w + "px";
          d.style.height = h + "px";
          d.style.fontFamily = el.fontFamily || "Inter, system-ui, sans-serif";
          d.style.fontSize = (el.fontSize || 16) + "px";
          d.style.color = el.color || "#fff";
          d.style.lineHeight = "1.2";
          if (el.wrap) {
            d.style.whiteSpace = "normal";
          }

          // bind to payload
          let txt = el.text || "";
          switch (el.type) {
            case "CITY":
              txt = payload.city || txt;
              break;
            case "TEMP":
              if (payload.weather && typeof payload.weather.temp !== "undefined") {
                txt = payload.weather.temp + "°C";
              }
              break;
            case "HUMIDITY":
              if (payload.weather && typeof payload.weather.humidity !== "undefined") {
                txt = "Humidity: " + payload.weather.humidity + "%";
              }
              break;
            case "JOKE":
              if (payload.dad_joke) txt = payload.dad_joke;
              break;
            default:
              // keep el.text
              break;
          }

          d.textContent = txt;
          root.appendChild(d);
        } else if (el.kind === "icon") {
          const img = document.createElement("img");
          img.className = "l-icon";
          img.style.left = x + "px";
          img.style.top = y + "px";
          img.style.width = w + "px";
          img.style.height = h + "px";
          img.style.objectFit = "contain";

          // src may be absolute (/gcs/assets/svgs/lemon.svg) or relative
          let src = el.src || "";
          if (!src && payload.svg_base && el.name) {
            // support future { "name": "lemon.svg" } style
            src = payload.svg_base.replace(/\/$/, "") + "/" + el.name;
          }
          img.src = src;
          root.appendChild(img);
        }
      });
    }

    // -------------------------------------------------------------
    // run with the payload we got
    // -------------------------------------------------------------
    (function main() {
      // background
      if (data.bg_url) {
        setBackground(data.bg_url);
      } else {
        // nothing? fine, black stays
      }

      // if we have a Designer layout, render it and exit
      if (data.layout && Array.isArray(data.layout.elements)) {
        renderDesignerLayout(data.layout, data);
      } else {
        // else: draw the fixed cards
        showFallbackWeather(data);
        showFallbackJoke(data);
      }
    })();
  </script>
</body>
</html>
