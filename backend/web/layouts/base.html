<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kin:D Family Display Render</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 800px;
      height: 480px;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      background: #fff;
    }
    
    #canvas {
      position: relative;
      width: 800px;
      height: 480px;
      overflow: hidden;
    }
    
    .el {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .el.text {
      z-index: 30;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    
    .el.icon {
      z-index: 30;
    }
    
    .el.box {
      z-index: 15;
    }
    
    .el.svg,
    .el.svg-overlay,
    .el.image {
      z-index: 20;
    }
    
    .el.weather-icon {
      z-index: 35;
    }
    
    .el svg {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    .background-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div id="canvas"></div>
  
  <script>
    // Parse data from URL query parameter
    const urlParams = new URLSearchParams(window.location.search);
    const encodedData = urlParams.get('data');
    
    if (!encodedData) {
      console.error('No data parameter provided');
      document.body.innerHTML = '<div style="padding: 20px;">Error: No render data provided</div>';
    } else {
      try {
        const dataJson = decodeURIComponent(encodedData);
        const data = JSON.parse(dataJson);
        console.log('Render data:', data);

        injectFontFaces(data.font_base);

        // Render the layout
        renderLayout(data);
      } catch (error) {
        console.error('Failed to parse render data:', error);
        document.body.innerHTML = '<div style="padding: 20px;">Error: Invalid render data</div>';
      }
    }
    
    /**
     * Resolve relative/absolute paths to full URLs
     */
    function resolveUrl(path, svg_base) {
      if (!path) return "";
      
      if (path.startsWith("http://") || path.startsWith("https://")) {
        return path;
      }
      
      if (path.startsWith("/")) {
        if (svg_base && svg_base.startsWith("http")) {
          const base = svg_base.split("/gcs/")[0];
          return base + path;
        }
        return path;
      }
      
      if (svg_base) {
        return svg_base + "/" + path;
      }
      
      return path;
    }
    
    /**
     * Resolve dynamic text content
     */
    const FONT_MANIFEST = [
      { family: 'Space Grotesk', file: 'SpaceGrotesk/SpaceGrotesk-VariableFont_wght.ttf' },
      { family: 'Inter', file: 'Inter/Inter-VariableFont_slnt,wght.ttf' },
      { family: 'Plus Jakarta Sans', file: 'PlusJakartaSans/PlusJakartaSans-VariableFont_wght.ttf' },
      { family: 'Public Sans', file: 'PublicSans/PublicSans-VariableFont_wght.ttf' },
      { family: 'Outfit', file: 'Outfit/Outfit-VariableFont_wght.ttf' },
      { family: 'Manrope', file: 'Manrope/Manrope-VariableFont_wght.ttf' },
      { family: 'Roboto', file: 'Roboto/Roboto-Regular.ttf' },
      { family: 'Source Sans 3', file: 'SourceSans3/SourceSans3-VariableFont_wght.ttf' },
      { family: 'Atkinson Hyperlegible', file: 'AtkinsonHyperlegible/AtkinsonHyperlegible-Regular.ttf' },
      { family: 'Merriweather', file: 'Merriweather/Merriweather-Regular.ttf' },
      { family: 'Noto Sans', file: 'NotoSans/NotoSans-Regular.ttf' }
    ];

    function injectFontFaces(fontBase) {
      if (document.getElementById('dynamic-fonts')) {
        return;
      }

      const base = fontBase || '../fonts';
      const cssChunks = FONT_MANIFEST.map(font => {
        const url = resolveUrl(font.file, base);
        return `@font-face { font-family: '${font.family}'; src: url('${url}') format('truetype'); font-display: swap; }`;
      });

      const style = document.createElement('style');
      style.id = 'dynamic-fonts';
      style.textContent = cssChunks.join('\n');
      document.head.appendChild(style);
    }

    function resolveDynamicText(type, data) {
      if (!type) return "";

      const normalized = String(type).toUpperCase();
      const weather = data.weather || {};
      const tomorrow = weather.tomorrow || {};

      switch (normalized) {
        case "WEATHER_TEMP":
        case "TEMP":
          if (weather.temp != null) {
            return `${weather.temp}°`;
          }
          return "";

        case "WEATHER_FEELS_LIKE":
        case "FEELS_LIKE":
          if (weather.feels_like != null) {
            return `Feels like ${weather.feels_like}°`;
          }
          return "";

        case "WEATHER_MINMAX":
        case "TEMP_RANGE":
          if (weather.temp_min != null && weather.temp_max != null) {
            return `${weather.temp_min}° / ${weather.temp_max}°`;
          }
          return "";

        case "WEATHER_DESC":
        case "DESC":
          return weather.desc || weather.description || "";

        case "WEATHER_DESC_EXTENDED":
        case "DESC_EXTENDED":
          return weather.desc_extended || weather.desc || weather.description || "";

        case "WEATHER_CITY":
        case "CITY":
          return weather.city || data.city || "";

        case "TOMORROW_DESC":
          return tomorrow.desc || "";

        case "TOMORROW_TEMP":
        case "TOMORROW_MINMAX":
          if (tomorrow.temp_min != null && tomorrow.temp_max != null) {
            return `${tomorrow.temp_min}° / ${tomorrow.temp_max}°`;
          }
          return "";

        case "HUMIDITY":
          if (weather.humidity != null) {
            return `Humidity: ${weather.humidity}%`;
          }
          return "";

        case "RAIN":
          if (weather.rain != null) {
            return `Rain: ${weather.rain}mm`;
          }
          return "";

        case "WIND":
          if (weather.wind != null) {
            return `Wind: ${weather.wind}km/h`;
          }
          return "";

        case "DAD_JOKE":
        case "JOKE":
          return data.dad_joke || "";

        case "DATE":
          return data.date || "";

        default:
          return "";
      }
    }

    function applyTextShadowStyle(element, type, color, intensity) {
      if (!element) return;

      if (!type || type === 'none') {
        element.style.textShadow = 'none';
        element.style.filter = 'none';
        return;
      }

      const safeColor = color || '#000000';
      const parsedIntensity = parseFloat(intensity);
      const safeIntensity = Number.isFinite(parsedIntensity) ? parsedIntensity : 1;
      const blur = Math.round(safeIntensity * 4);

      if (type === 'shadow') {
        element.style.textShadow = `2px 2px ${blur}px ${safeColor}`;
        element.style.filter = 'none';
      } else if (type === 'glow') {
        element.style.textShadow = `0 0 ${blur}px ${safeColor}, 0 0 ${blur * 2}px ${safeColor}, 0 0 ${blur * 3}px ${safeColor}`;
        element.style.filter = 'none';
      } else {
        element.style.textShadow = 'none';
        element.style.filter = 'none';
      }
    }

    /**
     * Calculate z-index based on element type
     */
    function getLayerZIndex(el, providedKind) {
      const kind = (providedKind || el.kind || "").toLowerCase();
      
      if (kind === "text" || kind === "icon") {
        return 30;
      }

      if (kind === "svg" || kind === "svg-overlay" || kind === "image") {
        const source = String(el.src || el.svgName || "");
        if (source === "weather-icon" || source.startsWith("weather-")) {
          return 35;
        }
        return 20;
      }

      if (kind === "box") {
        return 15;
      }

      return 10;
    }

    /**
     * Load SVG from URL and inline it
     */
    async function inlineSvgInto(elDiv, url) {
      console.log("📥 Fetching SVG:", url);
      
      try {
        const response = await fetch(url, { mode: "cors" });
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        
        const svgText = await response.text();
        elDiv.innerHTML = svgText;
        
        const svg = elDiv.querySelector("svg");
        if (svg) {
          svg.setAttribute("width", "100%");
          svg.setAttribute("height", "100%");
          svg.style.display = "block";
        }
        
        console.log("✓ SVG loaded successfully");
      } catch (error) {
        console.error("Failed to load SVG:", error);
        elDiv.innerHTML = `<div style="color: red; font-size: 12px;">SVG Load Error</div>`;
      }
    }

    /**
     * Render the complete layout
     */
    async function renderLayout(data) {
      const canvas = document.getElementById('canvas');
      const layout = data.layout || {};
      const elements = layout.elements || [];
      const svg_base = data.svg_base || "";
      
      console.log('SVG Base:', svg_base);
      console.log('Rendering', elements.length, 'elements');
      
      if (data.bg_url) {
        const bgImg = document.createElement('img');
        bgImg.src = data.bg_url;
        bgImg.className = 'background-image';
        bgImg.onerror = () => {
          console.warn('Background image failed to load:', data.bg_url);
        };
        canvas.appendChild(bgImg);
      }
      
      for (const el of elements) {
        const elDiv = document.createElement('div');
        elDiv.className = 'el';
        
        const kind = (el.kind || 'box').toLowerCase();
        elDiv.classList.add(kind);
        
        elDiv.style.left = (el.x || 0) + 'px';
        elDiv.style.top = (el.y || 0) + 'px';
        elDiv.style.width = (el.w || el.width || 100) + 'px';
        elDiv.style.height = (el.h || el.height || 100) + 'px';
        
        const zIndex = el.zIndex || getLayerZIndex(el, kind);
        elDiv.style.zIndex = zIndex;
        
        if (el.opacity != null) {
          elDiv.style.opacity = el.opacity;
        }
        
        if (kind === 'text' || kind === 'icon') {
          const contentDiv = document.createElement('div');
          contentDiv.className = 'el-content';
          
          let textContent = el.text || '';
          if (el.type && el.type !== 'CUSTOM') {
            textContent = resolveDynamicText(el.type, data);
          }
          
          contentDiv.textContent = textContent;
          contentDiv.style.fontSize = (el.fontSize || 16) + 'px';
          contentDiv.style.color = el.color || '#000';
          contentDiv.style.fontWeight = el.fontWeight || 'normal';
          if (el.fontFamily) {
            contentDiv.style.fontFamily = `'${el.fontFamily}', sans-serif`;
          }
          contentDiv.style.width = '100%';
          contentDiv.style.height = '100%';
          contentDiv.style.display = 'flex';
          contentDiv.style.alignItems = 'center';
          contentDiv.style.justifyContent = 'center';
          contentDiv.style.textAlign = 'center';

          if (el.textShadowType && el.textShadowType !== 'none') {
            applyTextShadowStyle(contentDiv, el.textShadowType, el.textShadowColor, el.textShadowIntensity);
          } else if (el.textShadow) {
            contentDiv.style.textShadow = el.textShadow;
          }

          elDiv.appendChild(contentDiv);
          
        } else if (kind === 'box') {
          if (el.background || el.fill) {
            elDiv.style.background = el.background || el.fill;
          }
          if (el.borderColor) {
            elDiv.style.border = '1px solid ' + el.borderColor;
          }
          if (el.borderRadius || el.radius) {
            elDiv.style.borderRadius = (el.borderRadius || el.radius) + 'px';
          }
          
        } else if (kind === 'svg' || kind === 'svg-overlay' || kind === 'image') {
          let src = el.src || el.svgName || '';
          
          if (src === 'weather-icon') {
            if (data.weather?.icon_url) {
              src = data.weather.icon_url;
              elDiv.classList.add('weather-icon');
            } else {
              console.warn('No weather icon URL available');
              continue;
            }
          }
          
          const fullUrl = resolveUrl(src, svg_base);
          
          if (fullUrl.endsWith('.svg')) {
            await inlineSvgInto(elDiv, fullUrl);
          } else {
            const img = document.createElement('img');
            img.src = fullUrl;
            img.style.width = '100%';
            img.style.height = '100%';
            img.style.objectFit = 'contain';
            img.onerror = () => {
              console.error('Image failed to load:', fullUrl);
            };
            elDiv.appendChild(img);
          }
        }
        
        canvas.appendChild(elDiv);
      }
      
      console.log('✓ Layout rendered successfully');
    }
  </script>
</body>
</html>
