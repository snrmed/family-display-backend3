<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kin:D Base Layout</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg: #111;
      --card: #e3e3e3;
      --radius: 18px;
      --pad: 18px;
      --text: #000;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 800px;   /* will be overridden by viewport in Playwright */
      height: 480px;
      background: var(--bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      position: relative;
      overflow: hidden;
    }
    /* background image */
    #bgImg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }
    /* optional decorative SVG */
    #decorSvg {
      position: absolute;
      top: 24px;
      left: 24px;
      width: 140px;
      height: 140px;
      object-fit: contain;
      z-index: 2;
      display: none; /* we only show it when svg_url exists */
      pointer-events: none;
    }
    /* top-right control button */
    #topBtn {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 56px;
      height: 56px;
      background: rgba(227,227,227,0.95);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      z-index: 3;
    }
    /* weather card (bottom-left) */
    #weatherCard {
      position: absolute;
      left: 16px;
      bottom: 82px;
      width: 380px;
      min-height: 150px;
      background: rgba(227,227,227,0.95);
      border-radius: 18px 18px 0 0;
      padding: 16px 16px 14px 16px;
      z-index: 3;
      display: flex;
      gap: 14px;
    }
    #weatherIcon {
      width: 56px;
      height: 56px;
      object-fit: contain;
      flex: 0 0 56px;
      display: none; /* shown only when icon_url exists */
    }
    #weatherText {
      flex: 1;
      color: #000;
      font-size: 14px;
      line-height: 1.4;
    }
    #cityLine {
      font-weight: 600;
      margin-bottom: 6px;
    }
    /* joke bar bottom */
    #jokeBar {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 16px;
      background: rgba(227,227,227,0.95);
      border-radius: 18px;
      padding: 14px 20px;
      z-index: 3;
      font-size: 15px;
      line-height: 1.35;
      color: #000;
    }
  </style>
</head>
<body>
  <!-- background image from Pexels or fallback -->
  <img id="bgImg" alt="background" />
  <!-- optional decorative SVG (from designer) -->
  <img id="decorSvg" alt="decor" />
  <!-- top-right button -->
  <div id="topBtn">–</div>

  <!-- weather -->
  <div id="weatherCard" class="card">
    <img id="weatherIcon" alt="icon" />
    <div id="weatherText">
      <div id="cityLine">City</div>
      <div id="tempLine">--°C</div>
      <div id="humidLine">Humidity: --%</div>
      <div id="windLine">Wind: -- km/h</div>
      <div id="rainLine">Rain: --</div>
    </div>
  </div>

  <!-- joke -->
  <div id="jokeBar">No joke today.</div>

  <script>
    // small helper
    function getDataFromQuery() {
      const qs = new URLSearchParams(window.location.search);
      const raw = qs.get("data");
      if (!raw) return null;
      try {
        return JSON.parse(decodeURIComponent(raw));
      } catch (e) {
        console.warn("Cannot parse data param:", e);
        return null;
      }
    }

    const data = getDataFromQuery() || {};

    // 1) background
    const bg = document.getElementById("bgImg");
    if (data.bg_url) {
      bg.src = data.bg_url;
    } else {
      // tiny fallback
      bg.style.background = "#111";
    }

    // 2) decorative SVG (THIS IS THE NEW BIT)
    const decor = document.getElementById("decorSvg");
    if (data.svg_url) {
      decor.src = data.svg_url;
      decor.style.display = "block";
    } else {
      decor.style.display = "none";
    }

    // 3) weather
    const w = data.weather || {};
    const cityLine = document.getElementById("cityLine");
    const tempLine = document.getElementById("tempLine");
    const humidLine = document.getElementById("humidLine");
    const windLine = document.getElementById("windLine");
    const rainLine = document.getElementById("rainLine");
    const wIcon = document.getElementById("weatherIcon");

    cityLine.textContent = data.city || "—";
    tempLine.textContent = (w.temp !== undefined ? w.temp : "—") + "°C";
    humidLine.textContent = "Humidity: " + (w.humidity !== undefined ? w.humidity : "—") + "%";
    const windKmh = w.wind ? Math.round(w.wind * 3.6) : 0;
    windLine.textContent = "Wind: " + (windKmh || "0") + " km/h";
    rainLine.textContent = "Rain: " + (w.rain && w.rain > 0 ? w.rain + " mm" : "No rain");

    if (w.icon_url) {
      wIcon.src = w.icon_url;
      wIcon.style.display = "block";
    } else {
      wIcon.style.display = "none";
    }

    // 4) joke
    const jokeBar = document.getElementById("jokeBar");
    if (data.dad_joke) {
      jokeBar.textContent = data.dad_joke;
    } else {
      jokeBar.textContent = "No joke today.";
    }
  </script>
</body>
</html>
