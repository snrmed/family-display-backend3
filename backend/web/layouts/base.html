<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kin:D Family Display Render</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 800px;
      height: 480px;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      background: #fff;
    }
    
    #canvas {
      position: relative;
      width: 800px;
      height: 480px;
      overflow: hidden;
    }
    
    .el {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .el.text {
      z-index: 30;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    
    .el.icon {
      z-index: 30;
    }
    
    .el.box {
      z-index: 15;
    }
    
    .el.svg,
    .el.svg-overlay,
    .el.image {
      z-index: 20;
    }
    
    .el.weather-icon {
      z-index: 35;
    }
    
    .el svg {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    .background-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div id="canvas">
    <!-- Elements will be added here by JavaScript -->
  </div>

  <script>
    // EMERGENCY: If no renderData, show visible error
    if (!window.renderData) {
        document.body.innerHTML = '<div style="background:red;color:white;padding:20px;font-size:24px;">ERROR: No renderData injected</div>';
    }
    // Data will be injected by Playwright via window.renderData
    const renderData = window.renderData || {};
    const layoutData = renderData.layout || { elements: [] };
    const dynamicText = renderData.dynamic_text || {};
    const weatherData = renderData.weather || {};
    const moodForecasts = renderData.mood_forecasts || {};
    const svgBase = renderData.svg_base || "";
    const fontBase = renderData.font_base || "";
    const iconBase = renderData.icon_base || "";
    const bgUrl = renderData.bg_url || "";

    console.log('Render data loaded:', {
      layoutElements: layoutData.elements?.length || 0,
      dynamicText: Object.keys(dynamicText),
      moodForecasts: Object.keys(moodForecasts),
      svgBase,
      iconBase,
      bgUrl
    });

    // Add background image first
    if (bgUrl) {
      const canvas = document.getElementById('canvas');
      const bgImg = document.createElement('img');
      bgImg.src = bgUrl;
      bgImg.className = 'background-image';
      bgImg.alt = 'Background';
      bgImg.onerror = () => console.error('Failed to load background:', bgUrl);
      canvas.appendChild(bgImg);
    }

    function resolveUrl(path) {
      if (!path) return '';
      if (path.startsWith('http://') || path.startsWith('https://')) {
        return path;
      }
      if (path.startsWith('/gcs/')) {
        return svgBase.replace('/gcs/assets/svgs', '') + path;
      }
      if (path.startsWith('/') || path.startsWith('gcs/')) {
        const cleanPath = path.startsWith('/') ? path.substring(1) : path;
        return svgBase.replace('/gcs/assets/svgs', '/' + cleanPath);
      }
      return svgBase + '/' + path;
    }

    function getDynamicText(type, forecastMood, forecastDay) {
      // Handle mood forecast
      if (type === 'FORECAST_MOOD' && forecastMood && forecastDay) {
        const key = `${forecastMood}_${forecastDay}`;
        const forecast = moodForecasts[key];
        if (forecast) {
          console.log(`Using mood forecast ${key}: ${forecast}`);
          return forecast;
        }
        console.warn(`No mood forecast found for ${key}`);
        return 'Mood forecast updating...';
      }

      // Standard dynamic text
      if (dynamicText[type] !== undefined) {
        return dynamicText[type];
      }

      // Fallbacks
      switch (type) {
        case 'TEMP':
        case 'WEATHER_TEMP':
          return weatherData?.temp != null ? `${weatherData.temp}°C` : '--°C';
        case 'MINMAX':
        case 'WEATHER_MINMAX':
          if (weatherData?.temp_min != null && weatherData?.temp_max != null) {
            return `${weatherData.temp_min}° / ${weatherData.temp_max}°`;
          }
          return '--° / --°';
        case 'CITY':
          return weatherData?.city || 'City';
        case 'WEATHER_DESC':
          return weatherData?.desc || 'Sunny';
        case 'WEATHER_DESC_EXTENDED':
          return weatherData?.desc_extended || weatherData?.desc || 'Clear skies';
        case 'DATE':
          return dynamicText.DATE || '';
        case 'JOKE':
          return dynamicText.JOKE || 'No joke today';
        case 'HUMIDITY':
        case 'WEATHER_HUMIDITY':
          return weatherData?.humidity != null ? `${weatherData.humidity}%` : '--%';
        case 'RAIN':
          return weatherData?.rain != null ? `${weatherData.rain} mm` : '-- mm';
        case 'WIND':
          return weatherData?.wind != null ? `${weatherData.wind} km/h` : '-- km/h';
        case 'TOMORROW_DESC':
          return weatherData?.tomorrow?.desc || 'Partly cloudy';
        case 'TOMORROW_DESC_EXTENDED':
          return weatherData?.tomorrow?.desc_extended || 'Clear with mild conditions';
        case 'TOMORROW_TEMP':
          if (weatherData?.tomorrow?.temp_min != null && weatherData?.tomorrow?.temp_max != null) {
            return `${weatherData.tomorrow.temp_min}° / ${weatherData.tomorrow.temp_max}°`;
          }
          return '--° / --°';
        case 'CUSTOM':
          return '';
        default:
          return type;
      }
    }

    async function inlineSvgInto(el, src) {
      try {
        const url = resolveUrl(src);
        console.log(`Fetching SVG: ${src} -> ${url}`);
        
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        
        const svgText = await response.text();
        el.innerHTML = svgText;
        
        const svgEl = el.querySelector('svg');
        if (svgEl) {
          svgEl.style.width = '100%';
          svgEl.style.height = '100%';
        }
        
        console.log(`✓ SVG loaded: ${src}`);
      } catch (error) {
        console.error(`Failed to load SVG ${src}:`, error);
        el.innerHTML = `<div style="color:red;font-size:12px;">SVG load error: ${src}</div>`;
      }
    }

    function applyTextShadow(el, shadowType, shadowColor, shadowIntensity) {
      if (!shadowType || shadowType === 'none') return;
      
      const intensity = parseFloat(shadowIntensity) || 1;
      
      if (shadowType === 'shadow') {
        const offset = 2 * intensity;
        const blur = 4 * intensity;
        el.style.textShadow = `${offset}px ${offset}px ${blur}px ${shadowColor}`;
      } else if (shadowType === 'glow') {
        const blur = 8 * intensity;
        el.style.textShadow = `0 0 ${blur}px ${shadowColor}, 0 0 ${blur * 1.5}px ${shadowColor}`;
      }
    }

    function applySvgShadow(el, shadowType, shadowColor, shadowIntensity) {
      if (!shadowType || shadowType === 'none') return;
      
      const intensity = parseFloat(shadowIntensity) || 1;
      
      if (shadowType === 'shadow') {
        const offset = 2 * intensity;
        const blur = 4 * intensity;
        el.style.filter = `drop-shadow(${offset}px ${offset}px ${blur}px ${shadowColor})`;
      } else if (shadowType === 'glow') {
        const blur = 8 * intensity;
        el.style.filter = `drop-shadow(0 0 ${blur}px ${shadowColor}) drop-shadow(0 0 ${blur * 1.5}px ${shadowColor})`;
      }
    }

    function applyBoxShadow(el, shadowType, shadowColor, shadowIntensity) {
      if (!shadowType || shadowType === 'none') return;
      
      const intensity = parseFloat(shadowIntensity) || 1;
      const blur = Math.round(intensity * 8);
      const spread = Math.round(intensity * 2);
      const offset = Math.round(intensity * 2);
      
      if (shadowType === 'shadow') {
        el.style.boxShadow = `${offset}px ${offset}px ${blur}px ${shadowColor}`;
      } else if (shadowType === 'glow') {
        el.style.boxShadow = `0 0 ${blur}px ${spread}px ${shadowColor}`;
      }
    }

    async function renderElement(data) {
      const canvas = document.getElementById('canvas');
      const el = document.createElement('div');
      el.className = 'el';
      
      const kind = data.kind || 'text';
      el.classList.add(kind);
      
      el.style.left = (data.x || 0) + 'px';
      el.style.top = (data.y || 0) + 'px';
      el.style.width = (data.w || data.width || 100) + 'px';
      el.style.height = (data.h || data.height || 100) + 'px';
      el.style.opacity = data.opacity !== undefined ? data.opacity : 1;
      
      if (data.zIndex !== undefined) {
        el.style.zIndex = data.zIndex;
      } else if (kind === 'text' || kind === 'icon') {
        el.style.zIndex = 30;
      } else if (kind === 'weather-icon') {
        el.style.zIndex = 35;
      } else if (kind === 'box') {
        el.style.zIndex = 15;
      } else if (kind === 'svg' || kind === 'svg-overlay' || kind === 'image') {
        el.style.zIndex = 20;
      }

      if (kind === 'text' || kind === 'icon') {
        const content = document.createElement('div');
        content.className = 'el-content';
        content.style.fontSize = (data.fontSize || 24) + 'px';
        content.style.color = data.color || '#ffffff';
        content.style.fontWeight = data.fontWeight || '400';
        
        if (data.fontFamily) {
          content.style.fontFamily = `'${data.fontFamily}', sans-serif`;
        }
        
        const textType = data.type || 'CUSTOM';
        
        if (textType === 'FORECAST_MOOD') {
          const mood = data.forecastMood || 'upbeat';
          const day = data.forecastDay || 'today';
          content.textContent = getDynamicText(textType, mood, day);
          console.log(`Rendering mood forecast: ${mood} ${day}`);
        } else if (textType === 'CUSTOM') {
          content.textContent = data.text || '';
        } else {
          content.textContent = getDynamicText(textType);
        }
        
        if (data.textShadowType && data.textShadowType !== 'none') {
          applyTextShadow(content, data.textShadowType, data.textShadowColor || '#000000', data.textShadowIntensity || 1);
        }
        
        el.appendChild(content);
        
      } else if (kind === 'box') {
        el.style.background = data.background || 'rgba(255,255,255,0.2)';
        el.style.border = '1px solid ' + (data.borderColor || '#ffffff');
        el.style.borderRadius = (data.borderRadius || 12) + 'px';
        
        if (data.boxShadowType && data.boxShadowType !== 'none') {
          applyBoxShadow(el, data.boxShadowType, data.boxShadowColor || '#000000', data.boxShadowIntensity || 1);
        }
        
      } else if (kind === 'svg-overlay' && data.src) {
        await inlineSvgInto(el, data.src);
        
        if (data.svgShadowType && data.svgShadowType !== 'none') {
          applySvgShadow(el, data.svgShadowType, data.svgShadowColor || '#000000', data.svgShadowIntensity || 1);
        }
        
      } else if (kind === 'weather-icon') {
        const iconUrl = weatherData?.icon_url;
        if (iconUrl) {
          await inlineSvgInto(el, iconUrl);
          console.log('Weather icon loaded:', iconUrl);
        } else {
          console.warn('No weather icon URL available');
        }
      }
      
      canvas.appendChild(el);
    }

    async function renderLayout() {
      console.log('Starting layout render...');
      
      // DEBUG: Show what we received (will appear in PNG)
      const canvas = document.getElementById('canvas');
      const debug = document.createElement('div');
      debug.style.cssText = 'position:absolute;top:10px;left:10px;background:rgba(255,0,0,0.8);color:white;padding:10px;z-index:9999;font-size:14px;';
      debug.textContent = `Elements: ${layoutData?.elements?.length || 0} | Keys: ${Object.keys(renderData).join(',')} | Layout: ${!!layoutData} | Weather: ${!!weatherData}`;
      canvas.appendChild(debug);
      
      if (!layoutData || !layoutData.elements || layoutData.elements.length === 0) {
        console.warn('No layout elements to render');
        return;
      }
      
      console.log(`Rendering ${layoutData.elements.length} elements`);
      
      for (const elementData of layoutData.elements) {
        try {
          await renderElement(elementData);
        } catch (error) {
          console.error('Error rendering element:', error, elementData);
        }
      }
      
      console.log('Layout render complete');
    }

    // Start rendering when page loads
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        renderLayout().catch(error => {
          console.error('Fatal render error:', error);
        });
      });
    } else {
      renderLayout().catch(error => {
        console.error('Fatal render error:', error);
      });
    }
  </script>
</body>
</html>
