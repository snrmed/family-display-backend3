<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kin:D Frame</title>
  <meta name="viewport" content="width=800, initial-scale=1" />
  <style>
    :root {
      --w: 800px;
      --h: 480px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: var(--w);
      height: var(--h);
      background: #111;
      overflow: hidden;
      position: relative;
      font-family: var(--font);
    }
    #bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }
    #root {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }
    .el { position: absolute; pointer-events: none; }
    .wrap { white-space: normal; word-break: break-word; }
    #fallback-box {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      padding: 16px;
      background: rgba(200,0,0,0.9);
      color: #fff;
      border-radius: 16px;
      font-size: 14px;
      z-index: 99;
    }
  </style>
</head>
<body>
  <img id="bg" alt="background" />
  <div id="root"></div>
  <div id="fallback-box" style="display:none;">No layout found in data.layout.</div>

  <script>
    function getData() {
      const sp = new URLSearchParams(location.search);
      const raw = sp.get("data");
      if (!raw) return null;
      try { return JSON.parse(raw); } catch { return null; }
    }

    function makeTextFromType(el, data) {
      const t = (el.type || "").toUpperCase();
      switch (t) {
        case "CITY": return data.city || "City";
        case "TEMP": return (data.weather && data.weather.temp != null) ? (data.weather.temp + "°C") : "--°C";
        case "HUMIDITY": return (data.weather && data.weather.humidity != null) ? ("Humidity: " + data.weather.humidity + "%") : "Humidity: --%";
        case "JOKE": return data.dad_joke || "No joke today.";
        case "DATE": return data.date || "";
        default: return el.text || "";
      }
    }

    (async function init(){
      const data = getData();
      const bg = document.getElementById("bg");
      const root = document.getElementById("root");
      const fallback = document.getElementById("fallback-box");

      if (!data) {
        fallback.style.display = "block";
        return;
      }

      if (data.bg_url) {
        bg.src = data.bg_url;
      }

      const layout = data.layout;
      if (!layout || !Array.isArray(layout.elements) || layout.elements.length === 0) {
        fallback.style.display = "block";
        return;
      }
      fallback.style.display = "none";

      const svgBase = data.svg_base || "/gcs/assets/svgs";

      for (const el of layout.elements) {
        const d = document.createElement("div");
        d.className = "el";
        d.style.left = (el.x || 0) + "px";
        d.style.top = (el.y || 0) + "px";
        if (el.w != null) d.style.width = el.w + "px";
        if (el.h != null) d.style.height = el.h + "px";
        if (el.radius != null) d.style.borderRadius = el.radius + "px";
        if (el.fill) d.style.background = el.fill;
        if (el.border) d.style.border = el.border;
        if (el.shadow) d.style.boxShadow = el.shadow;
        if (el.opacity != null) d.style.opacity = el.opacity;

        const kind = (el.kind || "").toLowerCase();

        if (kind === "text") {
          const span = document.createElement("div");
          const txt = makeTextFromType(el, data);
          span.textContent = txt;
          if (el.fontFamily) span.style.fontFamily = el.fontFamily;
          if (el.fontSize) span.style.fontSize = el.fontSize + "px";
          if (el.color) span.style.color = el.color;
          if (el.wrap) span.classList.add("wrap");
          d.appendChild(span);
        } else if (kind === "icon") {
          // figure out the URL
          let src = el.src || "";
          if (src && !src.startsWith("http") && !src.startsWith("/")) {
            src = svgBase.replace(/\/$/, "") + "/" + src;
          }
          // if it's an svg → fetch & inline
          if (src.endsWith(".svg")) {
            try {
              const r = await fetch(src, {mode: "cors"});
              const svgText = await r.text();
              const holder = document.createElement("div");
              holder.innerHTML = svgText;
              const svgEl = holder.firstElementChild;
              if (svgEl) {
                svgEl.setAttribute("width", "100%");
                svgEl.setAttribute("height", "100%");
                d.appendChild(svgEl);
              }
            } catch (e) {
              const fall = document.createElement("div");
              fall.textContent = "svg";
              fall.style.color = "#fff";
              d.appendChild(fall);
            }
          } else {
            // normal image (png/jpg)
            const img = document.createElement("img");
            img.src = src;
            img.style.width = "100%";
            img.style.height = "100%";
            img.style.objectFit = "contain";
            d.appendChild(img);
          }
        }

        root.appendChild(d);
      }
    })();
  </script>
</body>
</html>
