<!DOCTYPE html>
<html lang="en">
<head>
<script>
window.TYPE_LABELS = {
  'CUSTOM':'Custom Text',
  'TEMP':'Temperature',
  'WEATHER_MINMAX':'Min / Max Temp',
  'CITY':'City Name',
  'WEATHER_DESC':'Weather Description',
  'WEATHER_DESC_EXTENDED':'Weather Extended',
  'TOMORROW_DESC':'Tomorrow Forecast',
  'TOMORROW_TEMP':'Tomorrow Min/Max',
  'DATE':'Date',
  'JOKE':'Dad Joke',
  'HUMIDITY':'Humidity',
  'RAIN':'Rain',
  'WIND':'Wind'
};
</script>
<script>window.SHOW_ALL_TYPES=true;</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kin:D Designer v4</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root{
  --bg:#0f0f0f;
  --panel:#1a1a1a;
  --panel-hover:#212121;
  --border:#2d2d2d;
  --text:#e8e8e8;
  --text-muted:#888;
  --brand:#2d8cf0;
  --brand-hover:#1a6ec0;
  --success:#27ae60;
  --warning:#f39c12;
  --danger:#e74c3c;
  --grid:#1a1a1a;
  --radius:8px;
  --shadow:0 4px 16px rgba(0,0,0,0.4);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
  height:100vh;
}

/* === HEADER === */
.header{
  background:var(--panel);
  border-bottom:2px solid var(--border);
  padding:16px 24px;
  display:flex;
  align-items:center;
  gap:20px;
}

.brand{
  display:flex;
  align-items:baseline;
  gap:8px;
  font-size:22px;
  font-weight:700;
}

.brand-logo{
  color:var(--brand);
}

.brand-name{
  color:var(--text);
}

.brand-tag{
  font-size:13px;
  color:var(--text-muted);
  font-weight:400;
}

.device-badge{
  background:var(--panel-hover);
  padding:6px 12px;
  border-radius:var(--radius);
  font-size:12px;
  color:var(--text-muted);
  border:1px solid var(--border);
}

.device-badge strong{
  color:var(--brand);
  margin-left:4px;
}

.header-actions{
  margin-left:auto;
  display:flex;
  gap:12px;
}

.btn{
  padding:8px 16px;
  border:1px solid var(--border);
  border-radius:var(--radius);
  background:var(--panel-hover);
  color:var(--text);
  font-size:13px;
  cursor:pointer;
  transition:all 0.2s;
  display:inline-flex;
  align-items:center;
  gap:6px;
}

.btn:hover{
  background:var(--brand);
  border-color:var(--brand);
  color:#fff;
}

.btn-primary{
  background:var(--brand);
  border-color:var(--brand);
  color:#fff;
  font-weight:600;
}

.btn-primary:hover{
  background:var(--brand-hover);
}

.btn-danger{
  background:var(--danger);
  border-color:var(--danger);
  color:#fff;
}

.btn-danger:hover{
  background:#c0392b;
}

.btn-success{
  background:var(--success);
  border-color:var(--success);
  color:#fff;
}

.btn-success:hover{
  background:#229954;
}

/* === MAIN LAYOUT === */
.main-container{
  display:flex;
  height:calc(100vh - 70px);
}

.toolbar{
  width:260px;
  background:var(--panel);
  border-right:2px solid var(--border);
  overflow-y:auto;
  padding:20px;
}

.canvas-area{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:auto;
}

.inspector{
  width:300px;
  background:var(--panel);
  border-left:2px solid var(--border);
  overflow-y:auto;
  padding:20px;
}

/* === TOOLBAR === */
.toolbar-title{
  font-size:16px;
  font-weight:600;
  margin-bottom:16px;
  color:var(--brand);
}

.tool-group{
  margin-bottom:24px;
}

.tool-group-title{
  font-size:13px;
  color:var(--text-muted);
  margin-bottom:12px;
  text-transform:uppercase;
  letter-spacing:0.5px;
  font-weight:600;
}

.tool-btn{
  width:100%;
  padding:12px;
  margin-bottom:8px;
  background:var(--panel-hover);
  border:1px solid var(--border);
  border-radius:var(--radius);
  color:var(--text);
  font-size:14px;
  cursor:pointer;
  transition:all 0.2s;
  display:flex;
  align-items:center;
  gap:8px;
}

.tool-btn:hover{
  background:var(--brand);
  border-color:var(--brand);
  color:#fff;
}

.form-group{
  margin-bottom:16px;
}

.form-label{
  display:block;
  font-size:12px;
  color:var(--text-muted);
  margin-bottom:6px;
  text-transform:uppercase;
  letter-spacing:0.5px;
  font-weight:600;
}

.form-select, .form-input{
  width:100%;
  padding:8px 12px;
  background:var(--panel-hover);
  border:1px solid var(--border);
  border-radius:var(--radius);
  color:var(--text);
  font-size:13px;
}

.form-select:focus, .form-input:focus{
  outline:none;
  border-color:var(--brand);
}

/* === CANVAS === */
.canvas-container{
  position:relative;
  width:800px;
  height:480px;
}

.canvas{
  width:800px;
  height:480px;
  background:#fff;
  position:relative;
  overflow:hidden;
  background-size:cover;
  background-position:center;
}

.grid-overlay{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

.grid-overlay line{
  stroke:var(--grid);
  stroke-width:1;
  opacity:0.3;
}

/* === ELEMENTS === */
.el{
  position:absolute;
  cursor:move;
  user-select:none;
}

.el.selected{
  outline:2px solid var(--brand);
  outline-offset:2px;
}

.el.text, .el.icon{
  display:flex;
  align-items:center;
  justify-content:center;
}

.el.box{
  border:2px solid;
}

.el.svg-overlay{
  pointer-events:all;
}

.el-content{
  pointer-events:none;
  white-space:pre-wrap;
  text-align:center;
}

.resize-handle{
  position:absolute;
  width:12px;
  height:12px;
  background:var(--brand);
  border:2px solid #fff;
  border-radius:50%;
  cursor:pointer;
  z-index:1000;
}

.resize-handle.tl{top:-6px;left:-6px;cursor:nwse-resize}
.resize-handle.tr{top:-6px;right:-6px;cursor:nesw-resize}
.resize-handle.bl{bottom:-6px;left:-6px;cursor:nesw-resize}
.resize-handle.br{bottom:-6px;right:-6px;cursor:nwse-resize}

/* === INSPECTOR === */
.inspector-empty{
  text-align:center;
  padding:40px 20px;
  color:var(--text-muted);
}

.inspector-empty-icon{
  font-size:48px;
  margin-bottom:16px;
}

.panel{
  background:var(--panel-hover);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:16px;
}

.panel-title{
  font-size:14px;
  font-weight:600;
  margin-bottom:12px;
  color:var(--brand);
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:12px;
}

.value-display{
  color:var(--brand);
  font-weight:600;
}

.hidden{
  display:none !important;
}

/* === STATUS === */
.status{
  position:fixed;
  bottom:20px;
  right:20px;
  padding:12px 20px;
  background:var(--panel);
  border:2px solid var(--border);
  border-radius:var(--radius);
  color:var(--text);
  font-size:14px;
  box-shadow:var(--shadow);
  opacity:0;
  transition:opacity 0.3s;
  z-index:10000;
}

.status.show{
  opacity:1;
}

.status.success{
  border-color:var(--success);
  color:var(--success);
}

.status.error{
  border-color:var(--danger);
  color:var(--danger);
}

/* === SECTIONS === */
.section{
  margin-bottom:20px;
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
}

.section-header{
  background:var(--panel-hover);
  padding:12px 16px;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:600;
  font-size:14px;
}

.section-toggle{
  color:var(--text-muted);
  transition:transform 0.2s;
}

.section.collapsed .section-toggle{
  transform:rotate(-90deg);
}

.section-content{
  padding:16px;
}

.section.collapsed .section-content{
  display:none;
}

input[type="range"]{
  width:100%;
  height:6px;
  border-radius:3px;
  background:var(--border);
  outline:none;
}

input[type="range"]::-webkit-slider-thumb{
  width:16px;
  height:16px;
  border-radius:50%;
  background:var(--brand);
  cursor:pointer;
}

input[type="color"]{
  width:100%;
  height:40px;
  border:1px solid var(--border);
  border-radius:var(--radius);
  cursor:pointer;
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="brand">
    <span class="brand-logo">kin;D</span>
    <span class="brand-name">Designer</span>
    <span class="brand-tag">v4</span>
  </div>
  <div class="device-badge">
    <span>Device:</span>
    <strong id="deviceName">familydisplay</strong>
  </div>
  <div class="header-actions">
    <button class="btn" onclick="goToSetup()">⚙️ Setup</button>
    <button class="btn" onclick="exportJSON()">💾 Export JSON</button>
    <button class="btn" onclick="previewFrame()">👁️ Preview</button>
    <button class="btn btn-success" onclick="saveLayout()">💾 Save Layout</button>
  </div>
</div>

<!-- MAIN CONTAINER -->
<div class="main-container">
  
  <!-- TOOLBAR -->
  <div class="toolbar">
    <div class="toolbar-title">🎨 Elements</div>
    
    <div class="tool-group">
      <div class="tool-group-title">Add Elements</div>
      <button class="tool-btn" onclick="addTextElement()">📝 Text</button>
      <button class="tool-btn" onclick="addIconElement()">✨ Icon</button>
      <button class="tool-btn" onclick="addBoxElement()">⬜ Box</button>
      <button class="tool-btn" onclick="addSVGElement()">🎨 SVG Overlay</button>
    </div>
    
    <!-- Presets Section -->
    <div class="section">
      <div class="section-header" onclick="toggleSection(this)">
        <span>📋 Presets</span>
        <span class="section-toggle">▼</span>
      </div>
      <div class="section-content">
        <div class="form-group">
          <label class="form-label">Load Preset</label>
          <select class="form-select" id="presetSelect" onchange="loadPreset()">
            <option value="">-- Select Preset --</option>
          </select>
        </div>
      </div>
    </div>
    
    <!-- Background Section -->
    <div class="section">
      <div class="section-header" onclick="toggleSection(this)">
        <span>🖼️ Background</span>
        <span class="section-toggle">▼</span>
      </div>
      <div class="section-content">
        <div class="form-group">
          <label class="form-label">Pexels Category</label>
          <select class="form-select" id="pexelsCategorySelect" onchange="updateBackgroundPreview()">
            <option value="">Loading...</option>
          </select>
        </div>
        <button class="btn" style="width:100%" onclick="refreshBackground()">🔄 Refresh Background</button>
      </div>
    </div>
    
  </div>
  
  <!-- CANVAS -->
  <div class="canvas-area">
    <div class="canvas-container">
      <div class="canvas" id="canvas">
        <!-- Elements will be added here -->
      </div>
      <svg class="grid-overlay" id="gridOverlay">
        <!-- Grid lines will be drawn here -->
      </svg>
    </div>
  </div>
  
  <!-- INSPECTOR -->
  <div class="inspector">
    <div id="inspectorEmpty" class="inspector-empty">
      <div class="inspector-empty-icon">👆</div>
      <p>Select an element to edit its properties</p>
    </div>
    
    <div id="inspectorContent" class="hidden">
      <!-- Transform Panel -->
      <div class="panel">
        <div class="panel-title">📐 Transform</div>
        <div class="row">
          <div>
            <label class="form-label">X</label>
            <input type="number" id="elX" class="form-input" value="0" onchange="updateElPosition()">
          </div>
          <div>
            <label class="form-label">Y</label>
            <input type="number" id="elY" class="form-input" value="0" onchange="updateElPosition()">
          </div>
        </div>
        <div class="row">
          <div>
            <label class="form-label">Width</label>
            <input type="number" id="elW" class="form-input" value="100" onchange="updateElSize()">
          </div>
          <div>
            <label class="form-label">Height</label>
            <input type="number" id="elH" class="form-input" value="100" onchange="updateElSize()">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Opacity <span class="value-display" id="elOpacityValue">1.00</span></label>
          <input type="range" id="elOpacity" min="0" max="1" step="0.01" value="1" oninput="updateElOpacity()">
        </div>
      </div>
      
      <!-- Text Panel -->
      <div class="panel" id="textPanel" style="display:none">
        <div class="panel-title">✏️ Text</div>
        <div class="form-group">
          <label class="form-label">Type</label>
          <select class="form-select" id="textType" onchange="updateTextType()">
            <option value="CUSTOM">Custom Text</option>
            <option value="TEMP">Temperature</option>
            <option value="WEATHER_MINMAX">Min / Max Temp</option>
            <option value="CITY">City Name</option>
            <option value="WEATHER_DESC">Weather Description</option>
            <option value="DATE">Date</option>
            <option value="JOKE">Dad Joke</option>
            <option value="HUMIDITY">Humidity</option>
            <option value="RAIN">Rain</option>
            <option value="WIND">Wind</option>
          </select>
        </div>
        <div class="form-group" id="customTextGroup">
          <label class="form-label">Content</label>
          <input type="text" class="form-input" id="textContent" value="Text" onchange="updateTextContent()">
        </div>
        <div class="form-group">
          <label class="form-label">Font Size <span class="value-display" id="fontSizeValue">24px</span></label>
          <input type="range" id="fontSize" min="12" max="120" value="24" oninput="updateTextStyle()">
        </div>
        <div class="form-group">
          <label class="form-label">Color</label>
          <input type="color" id="textColor" value="#ffffff" onchange="updateTextStyle()">
        </div>
        <div class="form-group">
          <label class="form-label">Font Weight</label>
          <select class="form-select" id="fontWeight" onchange="updateTextStyle()">
            <option value="300">Light</option>
            <option value="400">Normal</option>
            <option value="600">Semibold</option>
            <option value="700">Bold</option>
            <option value="900">Black</option>
          </select>
        </div>
      </div>
      
      <!-- Box Panel -->
      <div class="panel" id="boxPanel" style="display:none">
        <div class="panel-title">⬜ Box</div>
        <div class="form-group">
          <label class="form-label">Background</label>
          <input type="color" id="boxBg" value="#ffffff" onchange="updateBoxStyle()">
        </div>
        <div class="form-group">
          <label class="form-label">Border Color</label>
          <input type="color" id="boxBorder" value="#ffffff" onchange="updateBoxStyle()">
        </div>
        <div class="form-group">
          <label class="form-label">Border Radius <span class="value-display" id="borderRadiusValue">12px</span></label>
          <input type="range" id="borderRadius" min="0" max="50" value="12" oninput="updateBoxStyle()">
        </div>
      </div>
      
      <!-- Actions Panel -->
      <div class="panel">
        <button class="btn btn-danger" style="width:100%" onclick="deleteElement()">🗑️ Delete Element</button>
      </div>
    </div>
  </div>
</div>

<!-- STATUS -->
<div class="status" id="status"></div>

<script>
// ========================================================================
// GLOBAL STATE
// ========================================================================

const canvas = document.getElementById('canvas');
const gridOverlay = document.getElementById('gridOverlay');
let selectedEl = null;
let dragStartX = 0, dragStartY = 0;
let elStartX = 0, elStartY = 0;
let isDragging = false;
let isResizing = false;
let resizeDir = '';
let currentLayout = null;
let renderData = null;

// Get device ID from URL or default
const urlParams = new URLSearchParams(window.location.search);
const deviceId = urlParams.get('device') || 'familydisplay';
document.getElementById('deviceName').textContent = deviceId;

// ========================================================================
// INITIALIZATION
// ========================================================================

async function init() {
  drawGrid();
  await loadRenderData();
  await loadPresetsList();
  await loadPexelsCategoriesList();
  await loadCurrentLayout();
  setupEventListeners();
}

function drawGrid() {
  const gridSize = 20;
  for (let x = 0; x <= 800; x += gridSize) {
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x);
    line.setAttribute('y1', 0);
    line.setAttribute('x2', x);
    line.setAttribute('y2', 480);
    gridOverlay.appendChild(line);
  }
  for (let y = 0; y <= 480; y += gridSize) {
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', 0);
    line.setAttribute('y1', y);
    line.setAttribute('x2', 800);
    line.setAttribute('y2', y);
    gridOverlay.appendChild(line);
  }
}

async function loadRenderData() {
  try {
    const response = await fetch(`/v1/render_data?device=${deviceId}`);
    if (response.ok) {
      renderData = await response.json();
      console.log('Render data loaded:', renderData);
      
      // Set background if available
      if (renderData.bg_url) {
        canvas.style.backgroundImage = `url(${renderData.bg_url})`;
      }
    }
  } catch (error) {
    console.error('Failed to load render data:', error);
  }
}

async function loadPresetsList() {
  try {
    const response = await fetch('/api/list-presets');
    if (response.ok) {
      const data = await response.json();
      const select = document.getElementById('presetSelect');
      select.innerHTML = '<option value="">-- Select Preset --</option>';
      
      data.presets.forEach(preset => {
        const option = document.createElement('option');
        option.value = preset.path;
        option.textContent = preset.name;
        select.appendChild(option);
      });
      
      console.log(`Loaded ${data.presets.length} presets`);
    }
  } catch (error) {
    console.error('Failed to load presets:', error);
  }
}

async function loadPexelsCategoriesList() {
  try {
    const response = await fetch('/api/list-pexels-categories');
    if (response.ok) {
      const data = await response.json();
      const select = document.getElementById('pexelsCategorySelect');
      select.innerHTML = '';
      
      data.categories.forEach(category => {
        const option = document.createElement('option');
        option.value = category;
        option.textContent = category.charAt(0).toUpperCase() + category.slice(1);
        select.appendChild(option);
      });
      
      console.log(`Loaded ${data.categories.length} Pexels categories`);
    }
  } catch (error) {
    console.error('Failed to load Pexels categories:', error);
    // Fallback
    const select = document.getElementById('pexelsCategorySelect');
    select.innerHTML = '<option value="abstract">Abstract</option><option value="geometric">Geometric</option><option value="minimal">Minimal</option>';
  }
}

async function loadCurrentLayout() {
  try {
    const response = await fetch(`/v1/devices/${deviceId}/layouts/current`);
    if (response.ok) {
      const layout = await response.json();
      await loadLayout(layout);
    }
  } catch (error) {
    console.log('No existing layout found');
  }
}

function setupEventListeners() {
  canvas.addEventListener('mousedown', onCanvasMouseDown);
  document.addEventListener('mousemove', onDocumentMouseMove);
  document.addEventListener('mouseup', onDocumentMouseUp);
  
  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Delete' && selectedEl) {
      deleteElement();
    }
    if (e.key === 'Escape') {
      selectElement(null);
    }
  });
}

// ========================================================================
// ADD ELEMENTS
// ========================================================================

function addTextElement() {
  addElement('text', 100, 100, 200, 50, {
    text: 'Sample Text',
    fontSize: 24,
    color: '#ffffff',
    fontWeight: '400',
    type: 'CUSTOM'
  });
}

function addIconElement() {
  addElement('icon', 100, 100, 100, 100, {
    text: '☀️',
    fontSize: 72,
    color: '#ffffff',
    type: 'WEATHER_ICON'
  });
}

function addBoxElement() {
  addElement('box', 100, 100, 200, 150, {
    background: 'rgba(255,255,255,0.2)',
    borderColor: '#ffffff',
    borderRadius: 12
  });
}

async function addSVGElement() {
  // For now, add a placeholder
  addElement('svg-overlay', 100, 100, 150, 150, {
    src: 'weather-icon'
  });
}

async function addElement(kind, x, y, width, height, options = {}) {
  const el = document.createElement('div');
  el.className = `el ${kind}`;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.style.width = width + 'px';
  el.style.height = height + 'px';
  el.style.opacity = options.opacity || 1;
  
  if (kind === 'text') {
    el.style.zIndex = 20;
  } else if (kind === 'icon') {
    el.style.zIndex = options.zIndex || 35;
  } else if (kind === 'box') {
    el.style.zIndex = 15;
  }
  
  if (kind === 'text' || kind === 'icon') {
    const content = document.createElement('div');
    content.className = 'el-content';
    content.textContent = options.text || 'Text';
    content.style.fontSize = (options.fontSize || 24) + 'px';
    content.style.color = options.color || '#ffffff';
    content.style.fontWeight = options.fontWeight || '400';
    el.appendChild(content);
    
    el.dataset.type = options.type || 'CUSTOM';
    
    if (options.type && options.type !== 'CUSTOM') {
      content.textContent = getDynamicText(options.type);
    }
  } else if (kind === 'box') {
    el.style.background = options.background || 'rgba(255,255,255,0.2)';
    el.style.borderColor = options.borderColor || '#ffffff';
    el.style.borderRadius = (options.borderRadius || 12) + 'px';
  } else if (kind === 'svg-overlay' && options.src) {
    el.dataset.src = options.src;
    await loadSVGIntoElement(el, options.src);
  }
  
  canvas.appendChild(el);
  selectElement(el);
  
  updateStatus('✓ Element added', 'success');
}

async function loadSVGIntoElement(el, src) {
  try {
    let url;
    
    if (src === 'weather-icon') {
      // Use weather icon URL from render data
      url = renderData?.weather?.icon_url;
      if (!url) {
        console.warn('No weather icon URL available');
        return;
      }
    } else {
      // Regular SVG
      url = renderData?.svg_base ? `${renderData.svg_base}/${src}` : `/designer/svgs/${src}`;
    }
    
    const response = await fetch(url);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    
    const svgText = await response.text();
    el.innerHTML = svgText;
    
    const svg = el.querySelector('svg');
    if (svg) {
      svg.style.width = '100%';
      svg.style.height = '100%';
      svg.style.objectFit = 'contain';
    }
  } catch (error) {
    console.error('Failed to load SVG:', error);
    el.innerHTML = '<div style="color:red;font-size:12px;">SVG Error</div>';
  }
}

function getDynamicText(type) {
  if (!renderData) return 'Loading...';
  
  switch(type) {
    case 'TEMP':
      return `${renderData.weather?.temp || 0}°`;
    case 'WEATHER_MINMAX':
      return `${renderData.weather?.temp_min || 0}° / ${renderData.weather?.temp_max || 0}°`;
    case 'CITY':
      return renderData.weather?.city || 'City';
    case 'WEATHER_DESC':
      return renderData.weather?.desc || 'Weather';
    case 'DATE':
      return renderData.date || 'Date';
    case 'JOKE':
      return renderData.dad_joke || 'Loading joke...';
    case 'HUMIDITY':
      return `${renderData.weather?.humidity || 0}%`;
    case 'RAIN':
      return `${renderData.weather?.rain || 0}mm`;
    case 'WIND':
      return `${renderData.weather?.wind || 0}km/h`;
    default:
      return 'Text';
  }
}

// ========================================================================
// ELEMENT SELECTION & MANIPULATION
// ========================================================================

function selectElement(el) {
  // Clear previous selection
  if (selectedEl) {
    selectedEl.classList.remove('selected');
    clearResizeHandles(selectedEl);
  }
  
  if (!el) {
    selectedEl = null;
    updateInspector();
    return;
  }
  
  selectedEl = el;
  el.classList.add('selected');
  addResizeHandles(el);
  updateInspector();
}

function addResizeHandles(el) {
  if (el.querySelector('.resize-handle')) return;
  
  ['tl', 'tr', 'bl', 'br'].forEach(pos => {
    const handle = document.createElement('div');
    handle.className = `resize-handle ${pos}`;
    handle.addEventListener('mousedown', (e) => startResize(e, pos));
    el.appendChild(handle);
  });
}

function clearResizeHandles(el) {
  el.querySelectorAll('.resize-handle').forEach(h => h.remove());
}

function updateInspector() {
  const empty = document.getElementById('inspectorEmpty');
  const content = document.getElementById('inspectorContent');
  const textPanel = document.getElementById('textPanel');
  const boxPanel = document.getElementById('boxPanel');
  
  if (!selectedEl) {
    empty.classList.remove('hidden');
    content.classList.add('hidden');
    return;
  }
  
  empty.classList.add('hidden');
  content.classList.remove('hidden');
  
  // Update transform values
  document.getElementById('elX').value = parseInt(selectedEl.style.left);
  document.getElementById('elY').value = parseInt(selectedEl.style.top);
  document.getElementById('elW').value = parseInt(selectedEl.style.width);
  document.getElementById('elH').value = parseInt(selectedEl.style.height);
  document.getElementById('elOpacity').value = parseFloat(selectedEl.style.opacity || 1);
  document.getElementById('elOpacityValue').textContent = parseFloat(selectedEl.style.opacity || 1).toFixed(2);
  
  // Show/hide panels
  if (selectedEl.classList.contains('text') || selectedEl.classList.contains('icon')) {
    textPanel.style.display = 'block';
    boxPanel.style.display = 'none';
    
    const content = selectedEl.querySelector('.el-content');
    const style = window.getComputedStyle(content);
    
    document.getElementById('textType').value = selectedEl.dataset.type || 'CUSTOM';
    document.getElementById('textContent').value = content.textContent;
    document.getElementById('customTextGroup').style.display = 
      selectedEl.dataset.type === 'CUSTOM' ? 'block' : 'none';
    
    document.getElementById('fontSize').value = parseInt(style.fontSize);
    document.getElementById('fontSizeValue').textContent = parseInt(style.fontSize) + 'px';
    document.getElementById('textColor').value = rgbToHex(style.color);
    document.getElementById('fontWeight').value = style.fontWeight;
  } else if (selectedEl.classList.contains('box')) {
    textPanel.style.display = 'none';
    boxPanel.style.display = 'block';
    
    const style = window.getComputedStyle(selectedEl);
    document.getElementById('boxBg').value = rgbToHex(style.backgroundColor);
    document.getElementById('boxBorder').value = rgbToHex(style.borderColor);
    document.getElementById('borderRadius').value = parseInt(style.borderRadius);
    document.getElementById('borderRadiusValue').textContent = parseInt(style.borderRadius) + 'px';
  } else {
    textPanel.style.display = 'none';
    boxPanel.style.display = 'none';
  }
}

function rgbToHex(rgb) {
  if (rgb.startsWith('#')) return rgb;
  
  const match = rgb.match(/^rgba?\((\d+),\s*(\d+),\s*(\d+)/);
  if (!match) return '#ffffff';
  
  const r = parseInt(match[1]).toString(16).padStart(2, '0');
  const g = parseInt(match[2]).toString(16).padStart(2, '0');
  const b = parseInt(match[3]).toString(16).padStart(2, '0');
  return `#${r}${g}${b}`;
}

// ========================================================================
// INSPECTOR UPDATES
// ========================================================================

function updateElPosition() {
  if (!selectedEl) return;
  selectedEl.style.left = document.getElementById('elX').value + 'px';
  selectedEl.style.top = document.getElementById('elY').value + 'px';
}

function updateElSize() {
  if (!selectedEl) return;
  selectedEl.style.width = document.getElementById('elW').value + 'px';
  selectedEl.style.height = document.getElementById('elH').value + 'px';
}

function updateElOpacity() {
  if (!selectedEl) return;
  const opacity = document.getElementById('elOpacity').value;
  selectedEl.style.opacity = opacity;
  document.getElementById('elOpacityValue').textContent = parseFloat(opacity).toFixed(2);
}

function updateTextType() {
  if (!selectedEl) return;
  
  const type = document.getElementById('textType').value;
  selectedEl.dataset.type = type;
  
  document.getElementById('customTextGroup').style.display = 
    type === 'CUSTOM' ? 'block' : 'none';
  
  const content = selectedEl.querySelector('.el-content');
  if (type === 'CUSTOM') {
    content.textContent = document.getElementById('textContent').value;
  } else {
    content.textContent = getDynamicText(type);
  }
}

function updateTextContent() {
  if (!selectedEl) return;
  const content = selectedEl.querySelector('.el-content');
  if (content) {
    content.textContent = document.getElementById('textContent').value;
  }
}

function updateTextStyle() {
  if (!selectedEl) return;
  
  const content = selectedEl.querySelector('.el-content');
  if (!content) return;
  
  const fontSize = document.getElementById('fontSize').value;
  const color = document.getElementById('textColor').value;
  const weight = document.getElementById('fontWeight').value;
  
  content.style.fontSize = fontSize + 'px';
  content.style.color = color;
  content.style.fontWeight = weight;
  
  document.getElementById('fontSizeValue').textContent = fontSize + 'px';
}

function updateBoxStyle() {
  if (!selectedEl) return;
  
  selectedEl.style.backgroundColor = document.getElementById('boxBg').value;
  selectedEl.style.borderColor = document.getElementById('boxBorder').value;
  
  const radius = document.getElementById('borderRadius').value;
  selectedEl.style.borderRadius = radius + 'px';
  document.getElementById('borderRadiusValue').textContent = radius + 'px';
}

function deleteElement() {
  if (!selectedEl) return;
  selectedEl.remove();
  selectElement(null);
  updateStatus('✓ Element deleted', 'success');
}

// ========================================================================
// DRAG & RESIZE
// ========================================================================

function onCanvasMouseDown(e) {
  if (e.target === canvas || e.target === gridOverlay) {
    selectElement(null);
    return;
  }
  
  const el = e.target.classList.contains('el') ? e.target : e.target.closest('.el');
  if (!el) return;
  
  if (e.target.classList.contains('resize-handle')) return;
  
  selectElement(el);
  
  isDragging = true;
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  elStartX = parseInt(el.style.left);
  elStartY = parseInt(el.style.top);
  
  e.preventDefault();
}

function onDocumentMouseMove(e) {
  if (isDragging && selectedEl) {
    const dx = e.clientX - dragStartX;
    const dy = e.clientY - dragStartY;
    
    let newX = elStartX + dx;
    let newY = elStartY + dy;
    
    // Snap to grid
    newX = Math.round(newX / 20) * 20;
    newY = Math.round(newY / 20) * 20;
    
    selectedEl.style.left = newX + 'px';
    selectedEl.style.top = newY + 'px';
    
    document.getElementById('elX').value = newX;
    document.getElementById('elY').value = newY;
  }
  
  if (isResizing && selectedEl) {
    const dx = e.clientX - dragStartX;
    const dy = e.clientY - dragStartY;
    
    let newW = parseInt(selectedEl.style.width);
    let newH = parseInt(selectedEl.style.height);
    let newX = parseInt(selectedEl.style.left);
    let newY = parseInt(selectedEl.style.top);
    
    if (resizeDir.includes('r')) {
      newW = Math.max(20, elStartX + dx);
    }
    if (resizeDir.includes('b')) {
      newH = Math.max(20, elStartY + dy);
    }
    if (resizeDir.includes('l')) {
      const delta = dx;
      newX = elStartX + delta;
      newW = Math.max(20, parseInt(selectedEl.dataset.startW) - delta);
    }
    if (resizeDir.includes('t')) {
      const delta = dy;
      newY = elStartY + delta;
      newH = Math.max(20, parseInt(selectedEl.dataset.startH) - delta);
    }
    
    selectedEl.style.width = newW + 'px';
    selectedEl.style.height = newH + 'px';
    selectedEl.style.left = newX + 'px';
    selectedEl.style.top = newY + 'px';
    
    document.getElementById('elW').value = newW;
    document.getElementById('elH').value = newH;
    document.getElementById('elX').value = newX;
    document.getElementById('elY').value = newY;
  }
}

function onDocumentMouseUp() {
  isDragging = false;
  isResizing = false;
}

function startResize(e, dir) {
  e.stopPropagation();
  isResizing = true;
  resizeDir = dir;
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  elStartX = parseInt(selectedEl.style.width);
  elStartY = parseInt(selectedEl.style.height);
  selectedEl.dataset.startW = selectedEl.style.width;
  selectedEl.dataset.startH = selectedEl.style.height;
}

// ========================================================================
// LAYOUT OPERATIONS
// ========================================================================

function toJSON() {
  const elements = Array.from(canvas.querySelectorAll('.el')).map(el => {
    const base = {
      kind: el.classList.contains('text') ? 'text' :
            el.classList.contains('icon') ? 'icon' :
            el.classList.contains('box') ? 'box' :
            el.classList.contains('svg-overlay') ? 'svg-overlay' : 'box',
      x: parseInt(el.style.left),
      y: parseInt(el.style.top),
      width: parseInt(el.style.width),
      height: parseInt(el.style.height),
      opacity: parseFloat(el.style.opacity || 1),
      zIndex: parseInt(el.style.zIndex || 10)
    };
    
    if (base.kind === 'text' || base.kind === 'icon') {
      const content = el.querySelector('.el-content');
      const style = window.getComputedStyle(content);
      
      base.type = el.dataset.type || 'CUSTOM';
      base.text = content.textContent;
      base.fontSize = parseInt(style.fontSize);
      base.color = rgbToHex(style.color);
      base.fontWeight = style.fontWeight;
    }
    
    if (base.kind === 'box') {
      const style = window.getComputedStyle(el);
      base.background = rgbToHex(style.backgroundColor);
      base.borderColor = rgbToHex(style.borderColor);
      base.borderRadius = parseInt(style.borderRadius);
    }
    
    if (base.kind === 'svg-overlay') {
      base.src = el.dataset.src;
    }
    
    return base;
  });
  
  return {
    name: 'Layout',
    meta: {
      pexelsCategory: document.getElementById('pexelsCategorySelect').value
    },
    elements: elements
  };
}

async function saveLayout() {
  const layout = toJSON();
  
  try {
    const response = await fetch(`/v1/devices/${deviceId}/layouts/current`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(layout)
    });
    
    if (response.ok) {
      updateStatus('✓ Layout saved', 'success');
      return true;
    } else {
      throw new Error('Save failed');
    }
  } catch (error) {
    console.error('Save layout error:', error);
    updateStatus('⚠️ Save failed', 'error');
    return false;
  }
}

async function loadLayout(layout) {
  // Clear canvas
  canvas.querySelectorAll('.el').forEach(el => el.remove());
  selectElement(null);
  
  // Load meta
  if (layout.meta?.pexelsCategory) {
    document.getElementById('pexelsCategorySelect').value = layout.meta.pexelsCategory;
    await updateBackgroundPreview();
  }
  
  // Load elements
  for (const elem of layout.elements || []) {
    const options = { ...elem };
    await addElement(elem.kind, elem.x, elem.y, elem.width, elem.height, options);
  }
  
  selectElement(null);
  currentLayout = layout;
  
  updateStatus('✓ Layout loaded', 'success');
}

async function loadPreset() {
  const presetPath = document.getElementById('presetSelect').value;
  if (!presetPath) return;
  
  try {
    const response = await fetch(presetPath);
    if (!response.ok) throw new Error('Preset not found');
    
    const layout = await response.json();
    await loadLayout(layout);
    updateStatus('✓ Preset loaded', 'success');
  } catch (error) {
    console.error('Load preset error:', error);
    updateStatus('⚠️ Failed to load preset', 'error');
  }
}

// ========================================================================
// BACKGROUND OPERATIONS
// ========================================================================

async function updateBackgroundPreview() {
  const category = document.getElementById('pexelsCategorySelect').value;
  if (!category) return;
  
  // Refresh render data to get new random background
  await loadRenderData();
  
  updateStatus('✓ Background updated', 'success');
}

async function refreshBackground() {
  await updateBackgroundPreview();
}

// ========================================================================
// EXPORT & NAVIGATION
// ========================================================================

function exportJSON() {
  const layout = toJSON();
  const dataStr = JSON.stringify(layout, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  
  const a = document.createElement('a');
  a.href = url;
  a.download = `layout-${deviceId}-${Date.now()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  
  updateStatus('✓ Layout exported', 'success');
}

function goToSetup() {
  // Reload without designer to show setup screen
  window.location.href = `/designer/?device=${deviceId}&setup=true`;
}

async function previewFrame() {
  try {
    await saveLayout();
    window.open(`/v1/frame?device=${deviceId}`, '_blank');
  } catch (error) {
    console.error('Preview error:', error);
    updateStatus('⚠️ Failed to preview', 'error');
  }
}

// ========================================================================
// UI HELPERS
// ========================================================================

function updateStatus(message, type = '') {
  const status = document.getElementById('status');
  status.textContent = message;
  status.className = `status show ${type}`;
  
  setTimeout(() => {
    status.classList.remove('show');
  }, 3000);
}

function toggleSection(header) {
  const section = header.closest('.section');
  section.classList.toggle('collapsed');
}

// ========================================================================
// INITIALIZE
// ========================================================================

init();
</script>
